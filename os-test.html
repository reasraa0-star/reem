<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OS Test 2</title>
<style>body{font-family:Tahoma,sans-serif;background:#0b1220;color:#7fd6a4;padding:14px;font-size:13px;white-space:pre-wrap;line-height:2}</style>
</head><body><div id="log">⏳ فحص مصادر المكتبة...</div>
<script>
var L=document.getElementById('log');
function log(m){L.textContent+='\n'+m}
var URLS=[
 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.js',
 'https://onesignal.com/sdks/web/v16/OneSignalSDK.js',
 'https://cdn.jsdelivr.net/gh/OneSignal/OneSignal-Website-SDK@master/build/onesignal/OneSignalSDK.js',
 'https://unpkg.com/onesignal-web-sdk@1.2.0/build/onesignal/OneSignalSDK.js'
];
var done=0;
URLS.forEach(function(u,i){
  fetch(u,{method:'HEAD',mode:'no-cors'}).then(function(){log('✅ '+(i+1)+') فتح: '+u.split('/')[2])}).catch(function(){log('❌ '+(i+1)+') محجوب: '+u.split('/')[2])});
  var s=document.createElement('script');
  s.src=u;
  s.onload=function(){log('⚡ '+(i+1)+') تحميل كامل ناجح من: '+u.split('/')[2])};
  s.onerror=function(){done++;if(done===URLS.length)log('— انتهى الفحص، صوّر الشاشة —')};
});
setTimeout(function(){log('— انتهى الفحص، صوّر الشاشة —')},12000);
</script></body></html>
