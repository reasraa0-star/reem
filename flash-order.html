<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Mer — اطلب طلبك</title>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--bg:#070d1a;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--txt:#eef4fb;--mut:#8fa3bf;--cy:#22d3ee;--gd:#fbbf24;--gr:#34d399}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Tajawal,sans-serif;background:radial-gradient(900px 500px at 85% -100px,rgba(34,211,238,.15),transparent),radial-gradient(700px 400px at 10% 110%,rgba(251,191,36,.09),transparent),var(--bg);color:var(--txt);min-height:100dvh}
h1,h2,h3,.logo{font-family:Changa}
.hero{padding:30px 16px 10px;text-align:center}
.logo{font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--gd),var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--mut);font-size:13px;margin-top:4px}
.steps{display:flex;gap:8px;justify-content:center;margin:14px 0}
.steps span{background:var(--card);border:1px solid var(--line);border-radius:30px;padding:6px 14px;font-size:11px;color:var(--mut)}
.wrap{max-width:560px;margin:0 auto;padding:10px 16px 90px}
.card{background:var(--card);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:rgba(0,0,0,.3);color:var(--mut);font-weight:800;font-size:14px;cursor:pointer;font-family:Tajawal}
.tabs button.on{background:linear-gradient(135deg,var(--gd),var(--cy));color:#06202b;border-color:transparent}
.in{width:100%;padding:13px 14px;background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:12px;color:var(--txt);font-size:14px;margin-bottom:10px;font-family:Tajawal}
.in:focus{outline:none;border-color:var(--cy)}
.btn{border:none;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;font-size:15px;font-family:Tajawal;width:100%}
.b1{background:linear-gradient(135deg,var(--gd),var(--cy));color:#06202b;box-shadow:0 10px 26px rgba(34,211,238,.25)}
.b2{background:var(--card);border:1px solid var(--line);color:var(--txt)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ok{background:rgba(52,211,153,.12);border:1px solid var(--gr);border-radius:14px;padding:14px;text-align:center;color:var(--gr);font-weight:800;margin-bottom:10px}
.ord{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:12px;display:flex;gap:8px;align-items:center}
.st{border-radius:20px;padding:3px 10px;font-size:10px;font-weight:800}
.st.new{background:#fee2e2;color:#b91c1c}.st.assigned{background:#fef3c7;color:#b45309}.st.accepted,.st.delivered{background:#d1fae5;color:#047857}.st.waiting{background:#e0e7ff;color:#4338ca}
.inst{position:fixed;bottom:16px;left:16px;z-index:50}
.inst button{width:50px;height:50px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--gd),var(--cy));font-size:20px;cursor:pointer;box-shadow:0 10px 30px rgba(34,211,238,.4)}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0c1526;border:1px solid var(--cy);color:var(--cy);padding:10px 24px;border-radius:40px;font-weight:700;z-index:99;opacity:0;transition:.3s}.toast.on{opacity:1}
</style></head><body>
<div class="hero"><div class="logo">⚡ Flash Mer</div><p>توصيل طلبات درعا — بسرعة وأمان</p>
<div class="steps"><span>١ اطلب</span><span>٢ نوصلك</span><span>٣ ادفع</span></div></div>
<div class="wrap">
<div class="tabs"><button class="on" onclick="tab('c',this)">👤 زبون</button><button onclick="tab('m',this)">🏬 تاجر</button></div>
<div id="sec-c"><div class="card"><h3 style="color:var(--cy);margin-bottom:10px">🛵 طلبك لباب البيت</h3>
<input class="in" id="c_name" placeholder="الاسم الكامل *">
<input class="in" id="c_phone" type="tel" placeholder="رقم واتساب / اتصال * (إلزامي)">
<div class="row2"><input class="in" id="c_area" placeholder="المنطقة"><input class="in" id="c_amt" type="number" placeholder="مبلغ التحصيل"></div>
<input class="in" id="c_addr" placeholder="العنوان بالتفصيل">
<input class="in" id="c_note" placeholder="ملاحظة (بضاعة، كمية…)">
<button class="btn b1" onclick="sendOrder('cust')">⚡ إرسال الطلب</button>
<div id="c_ok"></div></div></div>
<div id="sec-m" style="display:none">
<div class="card" id="m_login"><h3 style="color:var(--gd);margin-bottom:10px">🔐 دخول التجار</h3>
<input class="in" id="m_user" placeholder="اسم المستخدم"><input class="in" id="m_pass" type="password" placeholder="كلمة السر">
<button class="btn b1" onclick="merLogin()">دخول</button></div>
<div class="card" id="m_panel" style="display:none"><h3 style="color:var(--gd);margin-bottom:10px">🏬 طلب تاجر — <span id="m_name"></span></h3>
<input class="in" id="m_phone" placeholder="هاتف المحل (واتساب)">
<div class="row2"><input class="in" id="m_area" placeholder="المنطقة"><input class="in" id="m_amt" type="number" placeholder="مبلغ التحصيل"></div>
<input class="in" id="m_addr" placeholder="العنوان / الفرع">
<input class="in" id="m_note" placeholder="تفاصيل البضاعة">
<button class="btn b1" onclick="sendOrder('mer')">⚡ إرسال طلب التاجر</button>
<div id="m_ok"></div>
<h3 style="color:var(--mut);font-size:13px;margin:12px 0 8px">طلباتي الأخيرة</h3><div id="m_list"></div></div>
</div>
</div>
<div class="inst"><button onclick="installApp()">📲</button></div>
<div class="toast" id="toast"></div>
<script>
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e",measurementId:"G-5L2R7Y2RQS"};
firebase.initializeApp(firebaseConfig);var FB=firebase.database();
var MER=LS('fm_mer',null),ST={new:'جديد',assigned:'مسند',accepted:'استلم',waiting:'انتظار',delivered:'مسلّم'};
function LS(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function $(s){return document.querySelector(s)}var _t;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(_t);_t=setTimeout(function(){t.classList.remove('on')},2400)}
function today(){return new Date().toISOString().slice(0,10)}
function tab(t,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#sec-c').style.display=t==='c'?'block':'none';$('#sec-m').style.display=t==='m'?'block':'none';if(t==='m'&&MER)showMer()}
function sendOrder(type){var name,phone,area,addr,amt,note,user='';
if(type==='cust'){name=$('#c_name').value.trim();phone=$('#c_phone').value.trim();area=$('#c_area').value;addr=$('#c_addr').value;amt=$('#c_amt').value;note=$('#c_note').value;
if(!name||!phone){toast('⚠️ الاسم ورقم الواتساب إلزامي');return}}
else{if(!MER){toast('⚠️ سجل دخول التاجر');return}name=MER.name;phone=$('#m_phone').value.trim()||MER.phone;area=$('#m_area').value;addr=$('#m_addr').value;amt=$('#m_amt').value;note=$('#m_note').value;user=MER.u;
if(!phone){toast('⚠️ رقم الهاتف إلزامي');return}}
var ts=Date.now(),o={code:'FM'+String(ts).slice(-6),cust:name,phone:phone,area:area,addr:addr,amount:+amt||0,type:type,user:user,note:note,status:'new',driver:'',driverName:'',eta:0,collected:0,ts:ts,day:today()};
FB.ref('fm/orders').push(o).then(function(){var html='<div class="ok">✅ وصل طلبك رقم <b>'+o.code+'</b><br><small>الإدارة وزّعته خلال دقائق — تابع حالتك واتسابياً</small></div>';
if(type==='cust')$('#c_ok').innerHTML=html;else{$('#m_ok').innerHTML=html;renderMer()}
['c_name','c_phone','c_area','c_addr','c_amt','c_note','m_area','m_addr','m_amt','m_note'].forEach(i=>{var e=$('#'+i);if(e)e.value=''});toast('⚡ أُرسل '+o.code)})}
function merLogin(){var u=$('#m_user').value.trim(),p=$('#m_pass').value;
FB.ref('fm/users/'+u).once('value').then(function(s){var v=s.val();
if(v&&v.role==='merchant'&&v.pass===p){MER={u:u,name:v.name,phone:v.phone||''};localStorage.setItem('fm_mer',JSON.stringify(MER));showMer();toast('🏪 أهلاً '+MER.name)}else toast('❌ بيانات خاطئة')})}
function showMer(){$('#m_login').style.display='none';$('#m_panel').style.display='block';$('#m_name').textContent=MER.name;$('#m_phone').value=MER.phone||'';renderMer()}
function renderMer(){if(!MER)return;FB.ref('fm/orders').orderByChild('user').equalTo(MER.u).limitToLast(10).once('value').then(function(s){var L=[];s.forEach(function(c){var o=c.val();o.id=c.key;L.push(o)});L.sort((a,b)=>b.ts-a.ts);
$('#m_list').innerHTML=L.map(o=>'<div class="ord"><b>'+o.code+'</b><span style="flex:1;color:var(--mut)">'+(o.note||o.addr||'')+'</span><span class="st '+o.status+'">'+ST[o.status]+'</span></div>').join('')||'<p style="color:var(--mut);font-size:12px">لا طلبات بعد.</p>'})}
var defP=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();defP=e});
function installApp(){if(defP)defP.prompt();else toast('ℹ️ من ⋮ بالمتصفح ← تثبيت / إضافة للشاشة الرئيسية')}
if(MER)showMer();
</script></body></html>
