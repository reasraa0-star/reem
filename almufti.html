<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>المفتي — سوق وتوصيل درعا</title>
<meta name="theme-color" content="#0b1f3a">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--navy:#0b1f3a;--navy2:#123055;--gold:#c9a24b;--gold2:#e0be6e;--bg:#f7f5f0;--txt:#1c2b3f;--mut:#8a94a6;--line:#e8e4da;--gr:#1e8e5a;--rd:#b3372f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal';background:var(--bg);color:var(--txt)}
h1,h2,h3{font-family:'Cairo'}button{font-family:'Tajawal';border:none;cursor:pointer;background:none}input,select,textarea{font-family:'Tajawal'}
.hide{display:none!important}
#splash{position:fixed;inset:0;background:radial-gradient(700px 340px at 50% -10%,rgba(201,162,75,.18),transparent),var(--navy);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .7s}
#splash.off{opacity:0;pointer-events:none}
#splash img{width:140px;height:140px;object-fit:contain;border-radius:50%;background:#fff;padding:6px;animation:pop 1s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#splash h1{color:var(--gold2);font-size:30px;font-weight:900;animation:up .8s .4s both}
#splash .tag{color:#cfd8e6;font-size:15px;font-weight:700;opacity:0;animation:up .8s both}
#splash .line{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:10px 0;animation:up .8s .8s both}
#splash .skip{position:absolute;bottom:34px;color:var(--gold);font-weight:700;font-size:14px;border:1px solid var(--gold);padding:9px 26px;border-radius:30px}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--navy),var(--navy2))}
.abox{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:26px;border-top:4px solid var(--gold)}
.abox img{width:78px;height:78px;display:block;margin:0 auto 8px;border-radius:50%;background:var(--navy);padding:4px}
.abox h2{text-align:center;color:var(--navy)}
.abox .sub{text-align:center;color:var(--mut);font-size:12px;margin:4px 0 18px}
.in{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;background:#fdfcf9;margin-bottom:10px}
.btn{display:block;width:100%;padding:14px;border-radius:11px;font-weight:800;font-size:15px}
.btn.g{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}
.btn.w{background:#fff;border:1.5px solid var(--line);color:var(--txt)}
.lnk{display:block;text-align:center;color:var(--gold);font-weight:700;font-size:13px;margin-top:12px;cursor:pointer}
#app{display:none;min-height:100vh;padding-bottom:80px}
.hdr{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:12px 16px;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
.hdr img{width:40px;height:40px;border-radius:50%;background:#fff;padding:3px;border:2px solid var(--gold)}
.hdr .t{flex:1;font-family:'Cairo';font-weight:900;color:var(--gold2)}
.hdr .out{color:#cfd8e6;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.25);padding:7px 14px;border-radius:20px}
.pad{padding:14px}
.sel{width:100%;padding:13px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative}
.pcard .im{width:100%;height:130px;object-fit:cover;background:#eef1f6}
.pcard .bd{padding:10px}
.pcard .nm{font-weight:800;font-size:13px;color:var(--navy)}
.pcard .ct{font-size:10.5px;color:var(--mut);margin:2px 0}
.pcard .pr{color:var(--gold);font-weight:800;font-size:14px}
.pcard .old{color:var(--mut);text-decoration:line-through;font-size:11px;margin-right:6px}
.off{position:absolute;top:8px;right:8px;background:var(--rd);color:#fff;font-size:10px;font-weight:800;padding:4px 9px;border-radius:6px}
.act{display:flex;gap:6px;margin-top:8px}
.tb{flex:1;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:800;border:1.5px solid var(--line);color:var(--txt);background:#fff}
.tb.gold{background:var(--navy);border-color:var(--navy);color:var(--gold2)}
.tb.danger{color:var(--rd);border-color:#e8d5d3}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{color:var(--navy);font-size:15px;margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ord{background:#fff;border-radius:12px;padding:13px;margin-bottom:10px;border:1px solid var(--line)}
.ord .t{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.ord .s{font-size:11.5px;color:var(--mut);margin:4px 0}
.bdg{font-size:10px;font-weight:800;padding:4px 10px;border-radius:6px}
.bdg.new{background:#f7ecd8;color:var(--gold)}.bdg.assigned{background:#fdf3e3;color:#c77816}.bdg.picked{background:#e8f0fe;color:#2f6fed}.bdg.out{background:#e8f0fe;color:#2f6fed}.bdg.delivered{background:#e5f5ee;color:var(--gr)}
.conf{background:#f7f5f0;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:13px;line-height:1.9}
.conf b{color:var(--navy)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;z-index:60;height:60px}
.bnav a{flex:1;display:flex;align-items:center;justify-content:center;color:#93a5c0;font-size:12.5px;font-weight:700;border-top:2px solid transparent}
.bnav a.on{color:var(--gold2);border-top-color:var(--gold)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold2);padding:11px 22px;border-radius:30px;font-weight:700;z-index:200;opacity:0;transition:.4s;border:1px solid var(--gold)}
.toast.on{opacity:1}
.modal{display:none;position:fixed;inset:0;background:rgba(11,31,58,.55);z-index:90;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:460px;max-height:88vh;overflow:auto;border-top:4px solid var(--gold)}
.mbox h3{color:var(--navy);margin-bottom:10px}
</style></head><body>
<div id="splash"><img src="almufti-logo.png" onerror="this.style.display='none'"><h1>شركة المفتي</h1><div class="line"></div><p class="tag" style="animation-delay:.8s">أهلاً بكم في سوق وتوصيل درعا</p><p class="tag">دقةٌ في العمل</p><p class="tag">ثـقـة</p><p class="tag">مصداقيـة</p><button class="skip" onclick="endSplash()">دخول ‹</button></div>
<div id="auth" class="hide"><div class="abox"><img src="almufti-logo.png" onerror="this.style.display='none'"><h2 id="aTitle">تسجيل الدخول</h2><p class="sub">شركة المفتي — سوق وتوصيل درعا</p>
<div id="loginBox"><input class="in" id="lu" placeholder="اسم المستخدم"><input class="in" id="lp" type="password" placeholder="كلمة المرور"><button class="btn g" onclick="doLogin()">دخول</button><span class="lnk" onclick="showReg()">إنشاء حساب جديد</span></div>
<div id="regBox" class="hide"><input class="in" id="rName" placeholder="الاسم الكامل *"><input class="in" id="rUser" placeholder="اسم المستخدم *"><input class="in" id="rPass" type="password" placeholder="كلمة المرور *"><input class="in" id="rPhone" placeholder="رقم واتساب *"><select class="in" id="rRole" onchange="roleChg()"><option value="client">زبون — متسوق</option><option value="merchant">صاحب محل / تاجر</option></select><select class="in hide" id="rCat"><option value="">— اختر مجال المحل —</option></select><button class="btn g" onclick="doReg()">إنشاء الحساب</button><span class="lnk" onclick="showLogin()">لدي حساب — دخول</span></div></div></div>
<div id="app"><div class="hdr"><img src="almufti-logo.png" onerror="this.style.display='none'"><span class="t">المفتي</span><span class="out" onclick="logout()">خروج</span></div><div class="pad" id="content"></div></div>
<nav class="bnav hide" id="bnav"></nav>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script>
var SPLASH_MS=30000;
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e",measurementId:"G-5L2R7Y2RQS"};
firebase.initializeApp(firebaseConfig);var FB=firebase.database();
var CATS=['ملابس','أحذية','عطورات','إكسسوارات','أجهزة وموبايل','مواد غذائية','أخرى'];
var STL={new:'جديد',assigned:'مسند لسائق',picked:'استلمه السائق من المحل',out:'بالطريق إليك',delivered:'تم التسليم'};
var ME=null,USERS={},PRODUCTS=[],ORDERS=[],SET={percent:10,fee:5000,cur:'ل.س'},curCat='',curView='home',editId=null,prodImg='',splashDone=false,rsvId=null;
function $(s){return document.querySelector(s)}
var _t;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(_t);_t=setTimeout(function(){t.classList.remove('on')},2600)}
function money(v){return Number(v||0).toLocaleString('en-US')+' '+(SET.cur||'ل.س')}
function waNum(p){p=(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='963'+p.slice(1);return p}
setTimeout(endSplash,SPLASH_MS);
function endSplash(){if(splashDone)return;splashDone=true;$('#splash').classList.add('off');setTimeout(function(){$('#splash').style.display='none';if(!ME)$('#auth').classList.remove('hide')},700)}
/* عدّاد الزوار */
(function(){try{var name='',role='';var mu=JSON.parse(sessionStorage.getItem('mu_ok')||'null');
if(mu){name=mu.name;role=(mu.role==='merchant'?'تاجر':'زبون')}
FB.ref('mufti/visitsCount').transaction(function(c){return (c||0)+1});
FB.ref('mufti/visits').push({name:name||'زائر',role:role||'زائر',ts:Date.now()});}catch(e){}})();
CATS.forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=c;$('#rCat').appendChild(o)});
function roleChg(){$('#rCat').classList.toggle('hide',$('#rRole').value!=='merchant')}
function showReg(){$('#loginBox').classList.add('hide');$('#regBox').classList.remove('hide');$('#aTitle').textContent='إنشاء حساب'}
function showLogin(){$('#regBox').classList.add('hide');$('#loginBox').classList.remove('hide');$('#aTitle').textContent='تسجيل الدخول'}
function doLogin(){var u=$('#lu').value.trim();FB.ref('mufti/users/'+u).once('value').then(function(s){var v=s.val();
if(!v||v.pass!==$('#lp').value){toast('بيانات غير صحيحة');return}
if(v.role==='merchant'&&v.active===false){toast('حسابك بانتظار تفعيل الإدارة');return}
ME=v;ME.u=u;sessionStorage.setItem('mu_ok',JSON.stringify(ME));enter()})}
function doReg(){var n=$('#rName').value.trim(),u=$('#rUser').value.trim(),p=$('#rPass').value,ph=$('#rPhone').value,r=$('#rRole').value;
if(!n||!u||!p||!ph){toast('أكمل الحقول');return}
if(r==='merchant'&&!$('#rCat').value){toast('اختر مجال المحل');return}
FB.ref('mufti/users/'+u).set({name:n,pass:p,phone:ph,role:r,category:r==='merchant'?$('#rCat').value:'',active:r!=='merchant',ts:Date.now()}).then(function(){
if(r==='merchant'){toast('أُرسل طلبك — سيصلك واتساب عند التفعيل');showLogin()}
else{ME={name:n,pass:p,phone:ph,role:r,active:true};ME.u=u;sessionStorage.setItem('mu_ok',JSON.stringify(ME));endSplash();enter();toast('أهلاً '+n)}})}
function logout(){sessionStorage.removeItem('mu_ok');location.reload()}
function enter(){$('#auth').classList.add('hide');$('#app').style.display='block';$('#bnav').classList.remove('hide');buildNav();curView=ME.role==='merchant'?'shop':'home';render()}
function buildNav(){var n=ME.role==='merchant'?[['shop','متجري'],['browse','تصفح'],['myorders','طلباتي']]:[['home','السوق'],['myorders','طلباتي']];
$('#bnav').innerHTML=n.map(function(x){return '<a data-v="'+x[0]+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</a>'}).join('');mark()}
function mark(){var as=document.querySelectorAll('.bnav a');for(var i=0;i<as.length;i++)as[i].classList.toggle('on',as[i].dataset.v===curView)}
function go(v){curView=v;mark();render()}
function listen(){FB.ref('mufti/users').on('value',function(s){USERS={};s.forEach(function(c){USERS[c.key]=c.val()});render()});
FB.ref('mufti/products').on('value',function(s){PRODUCTS=[];s.forEach(function(c){var o=c.val();o.id=c.key;PRODUCTS.push(o)});render()});
FB.ref('mufti/orders').on('value',function(s){ORDERS=[];s.forEach(function(c){var o=c.val();o.id=c.key;ORDERS.push(o)});ORDERS.sort(function(a,b){return (b.ts||0)-(a.ts||0)});render()});
FB.ref('mufti/settings').on('value',function(s){if(s.val())SET=s.val()})}
function render(){if(!ME)return;var c=$('#content');
if(curView==='home')rHome(c);else if(curView==='browse')rBrowse(c);else if(curView==='shop')rShop(c);else rMyOrders(c)}
function catSel(){return '<div style="margin-bottom:12px"><select class="sel" onchange="curCat=this.value;render()"><option value="">كل الأقسام</option>'+CATS.map(function(x){return '<option '+(curCat===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div>'}
function rHome(c){var list=PRODUCTS.filter(function(p){return p.status==='active'&&(!curCat||p.category===curCat)});
c.innerHTML=catSel()+(list.length?'<div class="grid">'+list.map(function(p){return pCard(p,false)}).join('')+'</div>':'<div class="card" style="text-align:center;color:var(--mut)">لا منتجات</div>')}
function pCard(p,owner){var off=p.offer?Math.round((1-p.offer/p.price)*100):0;var b='';
if(!owner&&ME.role==='client')b='<div class="act"><button class="tb gold" onclick="reserve(\''+p.id+'\')">احجز الآن</button></div>';
if(owner)b='<div class="act"><button class="tb" onclick="editProd(\''+p.id+'\')">تعديل</button><button class="tb gold" onclick="offerProd(\''+p.id+'\')">عرض</button><button class="tb danger" onclick="delProd(\''+p.id+'\')">حذف</button></div>';
return '<div class="pcard">'+(off?'<span class="off">خصم '+off+'%</span>':'')+'<img class="im" src="'+(p.img||'')+'" onerror="this.src=\'almufti-logo.png\'"><div class="bd"><div class="nm">'+p.name+'</div><div class="ct">'+p.category+' • '+p.merchantName+'</div><div class="pr">'+money(p.offer||p.price)+(p.offer?'<span class="old">'+money(p.price)+'</span>':'')+'</div>'+b+'</div></div>'}
function reserve(id){var p=PRODUCTS.find(function(x){return x.id===id});if(!p)return;rsvId=id;var unit=p.offer||p.price;
$('#mbox').innerHTML='<h3>تأكيد الحجز — '+p.name+'</h3><div class="row2"><input class="in" id="qQty" type="number" value="1" min="1" oninput="rsvSum()"><input class="in" value="'+money(unit)+'" disabled></div><textarea class="in" id="qLoc" placeholder="مكان التوصيل بالتفصيل *"></textarea><div class="conf" id="rsvSum"></div><div class="row2"><button class="btn g" onclick="confirmReserve()">تأكيد الحجز</button><button class="btn w" onclick="closeM()">إلغاء</button></div>';
$('#modal').classList.add('on');rsvSum()}
function rsvSum(){var p=PRODUCTS.find(function(x){return x.id===rsvId});if(!p)return;var q=+$('#qQty').value||1;var unit=p.offer||p.price;var sub=unit*q;var cut=Math.round(sub*(SET.percent||0)/100);var tot=sub+cut+(+SET.fee||0);
$('#rsvSum').innerHTML='الكمية: <b>'+q+'</b><br>السعر: <b>'+money(sub)+'</b><br>نسبة المفتي: <b>'+money(cut)+'</b> • التوصيل: <b>'+money(SET.fee)+'</b><br>الإجمالي: <b style="color:var(--gold)">'+money(tot)+'</b>'}
function confirmReserve(){var p=PRODUCTS.find(function(x){return x.id===rsvId});if(!p)return;var q=+$('#qQty').value||1;var loc=$('#qLoc').value.trim();if(!loc){toast('اكتب مكان التوصيل');return}
var unit=p.offer||p.price,sub=unit*q,cut=Math.round(sub*(SET.percent||0)/100),tot=sub+cut+(+SET.fee||0);
var ts=Date.now(),code='AM'+String(ts).slice(-6);
FB.ref('mufti/orders').push({code:code,client:ME.u,clientName:ME.name,clientPhone:ME.phone,product:p.id,productName:p.name,merchant:p.merchant,merchantName:p.merchantName,qty:q,unit:unit,sub:sub,cut:cut,fee:+SET.fee||0,total:tot,location:loc,status:'new',ts:ts}).then(function(){closeM();
$('#mbox').innerHTML='<h3>✔ تم تأكيد الحجز</h3><div class="conf">رقم الطلب: <b>'+code+'</b><br>المنتج: <b>'+p.name+'</b> × <b>'+q+'</b><br>التوصيل: <b>'+loc+'</b><br>الإجمالي: <b style="color:var(--gold)">'+money(tot)+'</b><br><br>سيصلك الرد من الإدارة واتساب، أو تابع قائمة الطلبات.</div><button class="btn g" style="margin-top:12px" onclick="closeM()">حسناً</button>';
$('#modal').classList.add('on')})}
function closeM(){$('#modal').classList.remove('on')}
function rShop(c){var mine=PRODUCTS.filter(function(p){return p.merchant===ME.u});
c.innerHTML='<div class="card"><h3>متجري — '+ME.name+'</h3><button class="btn g" onclick="editProd()">＋ إضافة منتج</button></div>'+(mine.length?'<div class="grid">'+mine.map(function(p){return pCard(p,true)}).join('')+'</div>':'<div class="card" style="text-align:center;color:var(--mut)">أضف أول منتج</div>')}
function editProd(id){var p=id?PRODUCTS.find(function(x){return x.id===id}):null;editId=id||null;prodImg=p?(p.img||''):'';
$('#mbox').innerHTML='<h3>'+(p?'تعديل منتج':'منتج جديد')+'</h3><input class="in" id="pName" placeholder="اسم المنتج *" value="'+(p?p.name:'')+'"><select class="in" id="pCat">'+CATS.map(function(x){return '<option '+(p&&p.category===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select><div class="row2"><input class="in" id="pPrice" type="number" placeholder="السعر *" value="'+(p?p.price:'')+'"><input class="in" id="pOffer" type="number" placeholder="سعر العرض" value="'+(p?(p.offer||''):'')+'"></div><textarea class="in" id="pDesc" placeholder="وصف">'+(p?p.desc||'':'')+'</textarea><input class="in" type="file" id="pImgFile" accept="image/*"><div class="row2"><button class="btn g" onclick="saveProd()">حفظ</button><button class="btn w" onclick="closeM()">إلغاء</button></div>';
$('#modal').classList.add('on');
$('#pImgFile').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;if(f.size>1200000){toast('صورة كبيرة');return}var r=new FileReader();r.onload=function(){prodImg=r.result};r.readAsDataURL(f)})}
function saveProd(){var n=$('#pName').value.trim(),pr=+$('#pPrice').value||0;if(!n||!pr){toast('اسم وسعر مطلوبان');return}
var old=editId?PRODUCTS.find(function(x){return x.id===editId}):null;
var obj={merchant:ME.u,merchantName:ME.name,category:$('#pCat').value,name:n,price:pr,offer:+$('#pOffer').value||0,desc:$('#pDesc').value,img:prodImg||(old?old.img:'')||'almufti-logo.png',status:old?old.status:'pending',ts:Date.now()};
if(editId)FB.ref('mufti/products/'+editId).update(obj);else FB.ref('mufti/products').push(obj);
closeM();toast(editId?'تم التعديل':'أُرسل للمراجعة')}
function offerProd(id){var p=PRODUCTS.find(function(x){return x.id===id});var v=prompt('سعر العرض:',p.offer||'');if(v===null)return;FB.ref('mufti/products/'+id).update({offer:+v||0})}
function delProd(id){if(!confirm('حذف؟'))return;FB.ref('mufti/products/'+id).remove()}
function rBrowse(c){var list=PRODUCTS.filter(function(p){return p.status==='active'&&(!curCat||p.category===curCat)});
c.innerHTML='<div class="card" style="padding:10px;color:var(--mut);font-size:12px">تصفح فقط — التعديل بمتجرك.</div>'+catSel()+'<div class="grid">'+list.map(function(p){return pCard(p,false)}).join('')+'</div>'}
function rMyOrders(c){var list=ME.role==='merchant'?ORDERS.filter(function(o){return o.merchant===ME.u}):ORDERS.filter(function(o){return o.client===ME.u});
var body=list.length?list.map(function(o){var b='';
if(ME.role==='merchant'&&o.status==='assigned')b='<div class="s" style="color:var(--gold);font-weight:800">🚚 السائق '+(o.driverName||'')+' قادم للاستلام</div>';
if(ME.role==='merchant'&&o.status==='picked')b='<div class="s" style="color:var(--gr);font-weight:800">✅ تم الاستلام من محلك</div>';
return '<div class="ord"><div class="t"><span>'+(o.code||'—')+' — '+o.productName+' ×'+(o.qty||1)+'</span><span class="bdg '+o.status+'">'+(STL[o.status]||o.status)+'</span></div>'+(o.location?'<div class="s">📍 '+o.location+'</div>':'')+'<div class="s">💰 <b style="color:var(--gold)">'+money(o.total)+'</b></div>'+b+'</div>'}).join(''):'<div class="card" style="text-align:center;color:var(--mut)">لا طلبات</div>';
c.innerHTML='<h3 style="color:var(--navy);margin-bottom:10px">طلباتي</h3>'+body}
var saved=sessionStorage.getItem('mu_ok');if(saved){try{ME=JSON.parse(saved)}catch(e){}}
if(ME){splashDone=true;$('#splash').style.display='none';$('#auth').classList.add('hide');enter()}
listen();
</script></body></html>
