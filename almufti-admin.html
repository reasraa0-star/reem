<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المفتي — الإدارة</title>
<meta name="theme-color" content="#0b1f3a">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{--navy:#0b1f3a;--navy2:#123055;--gold:#c9a24b;--gold2:#e0be6e;--bg:#f7f5f0;--txt:#1c2b3f;--mut:#8a94a6;--line:#e8e4da;--gr:#1e8e5a;--rd:#b3372f}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Tajawal';background:var(--bg);color:var(--txt)}
h1,h2,h3{font-family:'Cairo'}button{font-family:'Tajawal';border:none;cursor:pointer;background:none}input,select{font-family:'Tajawal'}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy),var(--navy2));padding:20px}
.lb{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:28px;border-top:4px solid var(--gold);text-align:center}
.lb img{width:80px;height:80px;border-radius:50%;background:var(--navy);padding:4px;margin-bottom:8px}
.lb h2{color:var(--navy)}
.in{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;margin:6px 0;background:#fdfcf9}
.btn{display:block;width:100%;padding:13px;border-radius:11px;font-weight:800;font-size:14px;margin-top:8px}
.btn.g{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy)}
.btn.w{background:#fff;border:1.5px solid var(--line);color:var(--txt)}
#app{display:none;max-width:1100px;margin:0 auto;padding:14px}
.hdr{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold);margin-bottom:14px}
.hdr img{width:42px;height:42px;border-radius:50%;background:#fff;padding:3px;border:2px solid var(--gold)}
.hdr .t{flex:1;font-family:'Cairo';font-weight:900;color:var(--gold2)}
.hdr .out{border:1px solid rgba(255,255,255,.3);padding:7px 14px;border-radius:20px;color:#cfd8e6;font-size:12px;font-weight:700}
.nav{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.nav button{flex-shrink:0;padding:10px 18px;border-radius:24px;border:1.5px solid var(--line);background:#fff;color:var(--mut);font-weight:700;font-size:13px}
.nav button.on{background:var(--navy);color:var(--gold2);border-color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;border-top:3px solid var(--gold)}
.kpi .l{font-size:11px;color:var(--mut)}.kpi .v{font-size:19px;font-weight:800;color:var(--navy);font-family:'Cairo'}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{color:var(--navy);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pcard .im{width:100%;height:115px;object-fit:cover;background:#eef1f6}
.pcard .bd{padding:10px}.pcard .nm{font-weight:800;font-size:13px;color:var(--navy)}.pcard .ct{font-size:10px;color:var(--mut);margin:2px 0 6px}.pcard .pr{color:var(--gold);font-weight:800}
.act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tb{flex:1;min-width:80px;padding:9px 6px;border-radius:9px;font-size:11.5px;font-weight:800;border:1.5px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;text-align:center}
.tb.gold{background:var(--gr);border-color:var(--gr);color:#fff}
.tb.navy{background:var(--navy);border-color:var(--navy);color:var(--gold2)}
.tb.danger{color:var(--rd);border-color:#e8d5d3}
.ord{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.ord .t{font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ord .s{font-size:12px;color:var(--mut);margin:4px 0;line-height:1.6}
.ord .code{font-family:'Cairo';color:var(--navy)}
.bdg{font-size:10px;font-weight:800;padding:4px 10px;border-radius:6px}
.bdg.new{background:#f7ecd8;color:var(--gold)}.bdg.assigned{background:#fdf3e3;color:#c77816}.bdg.picked{background:#e8f0fe;color:#2f6fed}.bdg.out{background:#e8f0fe;color:#2f6fed}.bdg.delivered{background:#e5f5ee;color:var(--gr)}.bdg.pend{background:#f7ecd8;color:var(--gold)}
.empty{text-align:center;color:var(--mut);padding:20px;font-size:13px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold2);padding:11px 22px;border-radius:30px;font-weight:700;z-index:200;opacity:0;transition:.4s;border:1px solid var(--gold)}
.toast.on{opacity:1}
</style></head><body>
<div id="login"><div class="lb"><img src="almufti-logo.png" onerror="this.style.display='none'"><h2>إدارة شركة المفتي</h2>
<p style="color:var(--mut);font-size:12px;margin:6px 0">admin / 1234</p>
<input class="in" id="lu" value="admin"><input class="in" id="lp" type="password" value="1234">
<button class="btn g" onclick="doLogin()">دخول</button>
<button class="btn w" onclick="showSetup()">🔐 كلمة مرور جديدة</button>
<div id="setupBox" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><input class="in" id="newUser" value="admin"><input class="in" id="newPass" type="password" placeholder="كلمة مرور جديدة"><button class="btn g" onclick="setupCred()">حفظ</button></div>
</div></div>
<div id="app">
<div class="hdr"><img src="almufti-logo.png" onerror="this.style.display='none'"><span class="t">إدارة المفتي</span><span class="out" onclick="logout()">خروج</span></div>
<div class="nav">
<button class="on" onclick="go('dash',this)">اللوحة</button>
<button onclick="go('review',this)">المراجعة</button>
<button onclick="go('actm',this)">تفعيل التجار</button>
<button onclick="go('prods',this)">المنتجات</button>
<button onclick="go('ords',this)">الطلبات</button>
<button onclick="go('drvs',this)">السائقين</button>
<button onclick="go('vis',this)">الزوار</button>
<button onclick="go('merch',this)">التجار</button>
<button onclick="go('set',this)">الإعدادات</button>
</div>
<div id="content"></div>
</div>
<div class="toast" id="toast"></div>
<script>
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e",measurementId:"G-5L2R7Y2RQS"};
firebase.initializeApp(firebaseConfig);var FB=firebase.database();
var STL={new:'جديد',assigned:'مسند لسائق',picked:'استلمه السائق',out:'بالطريق للزبون',delivered:'تم التسليم'};
var USERS={},DRIVERS={},PRODUCTS=[],ORDERS=[],VISITS=[],VCOUNT=0,SET={percent:10,fee:5000,cur:'ل.س'},curV='dash';
function $(s){return document.querySelector(s)}
var _t;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(_t);_t=setTimeout(function(){t.classList.remove('on')},2600)}
function money(v){return Number(v||0).toLocaleString('en-US')+' '+(SET.cur||'ل.س')}
function waNum(p){p=(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='963'+p.slice(1);return p}
function doLogin(){var u=$('#lu').value.trim(),p=$('#lp').value;
var saved=localStorage.getItem('mufti_cred');
if(saved){try{var c=JSON.parse(saved);if(u===c.user&&p===c.pass){sessionStorage.setItem('ma_ok','1');enter();return}}catch(e){}}
if(u==='admin'&&p==='1234'){sessionStorage.setItem('ma_ok','1');enter();return}
FB.ref('mufti/adminpass').once('value').then(function(s){var d=s.val()||{};if(u===(d.user||'admin')&&p===(d.pass||'1234')){sessionStorage.setItem('ma_ok','1');enter()}else toast('بيانات غير صحيحة')}).catch(function(){if(u==='admin'&&p==='1234'){sessionStorage.setItem('ma_ok','1');enter()}else toast('بيانات غير صحيحة')})}
function showSetup(){$('#setupBox').style.display='block'}
function setupCred(){var u=$('#newUser').value.trim(),p=$('#newPass').value;if(!u||!p){toast('أدخل البيانات');return}
localStorage.setItem('mufti_cred',JSON.stringify({user:u,pass:p}));FB.ref('mufti/adminpass').set({user:u,pass:p}).catch(function(){});
$('#lp').value=p;$('#lu').value=u;toast('تم الحفظ');$('#setupBox').style.display='none'}
function logout(){sessionStorage.removeItem('ma_ok');location.reload()}
function enter(){$('#login').style.display='none';$('#app').style.display='block';listen()}
function go(v,b){curV=v;var bs=document.querySelectorAll('.nav button');for(var i=0;i<bs.length;i++)bs[i].classList.remove('on');b.classList.add('on');render()}
function listen(){
FB.ref('mufti/users').on('value',function(s){USERS={};s.forEach(function(c){USERS[c.key]=c.val()});render()});
FB.ref('mufti/drivers').on('value',function(s){DRIVERS={};s.forEach(function(c){DRIVERS[c.key]=c.val()});render()});
FB.ref('mufti/products').on('value',function(s){PRODUCTS=[];s.forEach(function(c){var o=c.val();o.id=c.key;PRODUCTS.push(o)});render()});
FB.ref('mufti/orders').on('value',function(s){ORDERS=[];s.forEach(function(c){var o=c.val();o.id=c.key;ORDERS.push(o)});ORDERS.sort(function(a,b){return (b.ts||0)-(a.ts||0)});render()});
FB.ref('mufti/visits').on('value',function(s){VISITS=[];s.forEach(function(c){VISITS.push(c.val())});VISITS.sort(function(a,b){return b.ts-a.ts});render()});
FB.ref('mufti/visitsCount').on('value',function(s){VCOUNT=s.val()||0;render()});
FB.ref('mufti/settings').on('value',function(s){if(s.val())SET=s.val();render()})}
function render(){var c=$('#content');if(!c)return;
if(curV==='dash')rDash(c);else if(curV==='review')rReview(c);else if(curV==='actm')rAct(c);else if(curV==='prods')rProds(c);else if(curV==='ords')rOrds(c);else if(curV==='drvs')rDrvs(c);else if(curV==='vis')rVis(c);else if(curV==='merch')rMerch(c);else rSet(c)}
function rDash(c){var rev=ORDERS.reduce(function(a,o){return a+(+o.cut||0)+(+o.fee||0)},0);
var pend=PRODUCTS.filter(function(p){return p.status!=='active'}).length;
var pm=Object.keys(USERS).filter(function(k){return USERS[k].role==='merchant'&&USERS[k].active===false}).length;
c.innerHTML='<div class="kpis"><div class="kpi"><div class="l">إيراد المفتي</div><div class="v">'+money(rev)+'</div></div><div class="kpi"><div class="l">الطلبات</div><div class="v">'+ORDERS.length+'</div></div><div class="kpi"><div class="l">الزوار</div><div class="v">'+VCOUNT+'</div></div><div class="kpi"><div class="l">للمراجعة</div><div class="v">'+pend+'</div></div><div class="kpi"><div class="l">تجار بانتظار</div><div class="v">'+pm+'</div></div></div>'}
function pAdm(p,rev){var b=rev?'<button class="tb gold" onclick="approve(\''+p.id+'\')">نشر</button>':'';
return '<div class="pcard"><img class="im" src="'+(p.img||'')+'" onerror="this.src=\'almufti-logo.png\'"><div class="bd"><div class="nm">'+p.name+'</div><div class="ct">'+p.category+' • '+p.merchantName+'</div><div class="pr">'+money(p.offer||p.price)+(p.offer?' <s style="color:var(--mut)">'+money(p.price)+'</s>':'')+'</div><div class="act">'+b+'<button class="tb danger" onclick="delProd(\''+p.id+'\')">حذف</button></div></div></div>'}
function rReview(c){var pend=PRODUCTS.filter(function(p){return p.status!=='active'});
c.innerHTML='<div class="card"><h3>بانتظار المراجعة ('+pend.length+')</h3>'+(pend.length?'<div class="grid">'+pend.map(function(p){return pAdm(p,true)}).join('')+'</div>':'<p class="empty">لا منشورات</p>')+'</div>'}
function rProds(c){c.innerHTML='<div class="card"><h3>كل المنتجات ('+PRODUCTS.length+')</h3>'+(PRODUCTS.length?'<div class="grid">'+PRODUCTS.map(function(p){return pAdm(p,p.status!=='active')}).join('')+'</div>':'<p class="empty">لا منتجات</p>')+'</div>'}
function approve(id){FB.ref('mufti/products/'+id).update({status:'active'});toast('تم النشر')}
function delProd(id){if(!confirm('حذف؟'))return;FB.ref('mufti/products/'+id).remove()}
function rAct(c){var pend=Object.keys(USERS).filter(function(k){return USERS[k].role==='merchant'&&USERS[k].active===false});
var body=pend.length?pend.map(function(k){var u=USERS[k];return '<div class="ord"><div class="t"><span>'+u.name+'</span><span class="bdg pend">بانتظار التفعيل</span></div><div class="s">📦 '+(u.category||'—')+' • 📱 '+u.phone+'</div><div class="act"><button class="tb gold" onclick="actMerch(\''+k+'\')">تفعيل + واتساب</button><button class="tb danger" onclick="delUser(\''+k+'\')">رفض</button></div></div>'}).join(''):'<p class="empty">لا طلبات تفعيل</p>';
c.innerHTML='<div class="card"><h3>تفعيل التجار ('+pend.length+')</h3>'+body+'</div>'}
function actMerch(k){var u=USERS[k];FB.ref('mufti/users/'+k).update({active:true}).then(function(){toast('تم التفعيل');
window.open('https://wa.me/'+waNum(u.phone)+'?text='+'*شركة المفتي*%0A✅ تم تفعيل حسابك — ادخل وابدأ بنشر منتجاتك.','_blank')})}
function delUser(k){if(!confirm('حذف؟'))return;FB.ref('mufti/users/'+k).remove()}
function rOrds(c){var drvOpts='<option value="">— سائق —</option>'+Object.keys(DRIVERS).map(function(k){return '<option value="'+k+'">'+DRIVERS[k].name+'</option>'}).join('');
var body=ORDERS.length?ORDERS.map(function(o){var b='';
if(o.status==='new')b='<select class="in" id="drv_'+o.id+'" style="margin-bottom:6px">'+drvOpts+'</select><button class="tb navy" onclick="assignDrv(\''+o.id+'\')">تعيين سائق + إعلامه</button>';
if(o.status==='picked')b='<button class="tb navy" onclick="sendAddr(\''+o.id+'\')">إرسال عنوان الزبون للسائق</button>';
if(o.status==='out')b='<button class="tb gold" onclick="setO(\''+o.id+'\',\'delivered\')">تأكيد التسليم</button>';
b+='<button class="tb" onclick="printBar(\''+o.id+'\')">باركود</button>';
return '<div class="ord"><div class="t"><span class="code">'+(o.code||'—')+'</span><span class="bdg '+o.status+'">'+(STL[o.status]||o.status)+'</span></div><div class="s">📦 <b style="color:var(--navy)">'+o.productName+'</b> × '+(o.qty||1)+'</div><div class="s">👤 '+o.clientName+' ('+o.clientPhone+') • 🏪 '+o.merchantName+'</div>'+(o.location?'<div class="s">📍 '+o.location+'</div>':'')+(o.driverName?'<div class="s">🚚 '+o.driverName+'</div>':'')+'<div class="s">💰 '+money(o.sub)+' + نسبة '+money(o.cut)+' + توصيل '+money(o.fee)+' = <b style="color:var(--gold)">'+money(o.total)+'</b></div><div class="act">'+b+'<button class="tb danger" onclick="delO(\''+o.id+'\')">حذف</button></div></div>'}).join(''):'<p class="empty">لا طلبات</p>';
c.innerHTML='<div class="card"><h3>الطلبات ('+ORDERS.length+')</h3>'+body+'</div>'}
function assignDrv(id){var o=ORDERS.find(function(x){return x.id===id});var m=USERS[o.merchant];if(!m){toast('المحل غير موجود');return}
var k=$('#drv_'+id).value;if(!k){toast('اختر سائق');return}var d=DRIVERS[k];
FB.ref('mufti/orders/'+id).update({status:'assigned',driver:k,driverName:d.name,driverPhone:d.phone,merchantPhone:m.phone}).then(function(){
window.open('https://wa.me/'+waNum(d.phone)+'?text='+'*🚚 المفتي — مهمة*%0A🏷 '+(o.code||'—')+'%0A📦 '+o.productName+' ×'+(o.qty||1)+'%0A🏪 استلم من: '+o.merchantName+'%0A📱 '+m.phone,'_blank');
window.open('https://wa.me/'+waNum(m.phone)+'?text='+'*المفتي*%0A🏷 '+(o.code||'—')+'%0A🚚 السائق '+d.name+' قادم للاستلام.','_blank');toast('تم التعيين')})}
function sendAddr(id){var o=ORDERS.find(function(x){return x.id===id});var d=DRIVERS[o.driver];if(!d){toast('السائق غير موجود');return}
FB.ref('mufti/orders/'+id).update({status:'out'}).then(function(){
window.open('https://wa.me/'+waNum(d.phone)+'?text='+'*📍 المفتي — عنوان التوصيل*%0A🏷 '+(o.code||'—')+'%0A📍 '+o.location+'%0A👤 '+o.clientName+'%0A📱 '+o.clientPhone,'_blank');toast('أُرسل العنوان')})}
function setO(id,st){FB.ref('mufti/orders/'+id).update({status:st});toast('تم')}
function delO(id){if(!confirm('حذف؟'))return;FB.ref('mufti/orders/'+id).remove()}
function printBar(id){var o=ORDERS.find(function(x){return x.id===id});if(!o||!o.code){toast('لا رقم');return}
var w=window.open('','_blank');
w.document.write('<html dir="rtl"><head><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script><style>body{font-family:Tahoma;text-align:center;padding:20px}.t{border:2px solid #0b1f3a;border-radius:14px;max-width:420px;margin:auto;overflow:hidden}.h{background:#0b1f3a;color:#e0be6e;padding:14px;font-weight:800}.b{padding:14px}</style></head><body><div class="t"><div class="h">شركة المفتي — '+o.code+'</div><div class="b"><p><b>'+o.productName+'</b> ×'+(o.qty||1)+'</p><p>'+o.merchantName+'</p><svg id="bc"></svg><p style="font-weight:800">'+money(o.total)+'</p></div></div><script>JsBarcode("#bc","'+o.code+'",{format:"CODE128",width:2,height:80,displayValue:true});onload=function(){setTimeout(function(){print()},400)}<\/script></body></html>');w.document.close()}
function rDrvs(c){var ks=Object.keys(DRIVERS);
var form='<div class="card"><h3>➕ إضافة سائق</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input class="in" id="dName" placeholder="الاسم *"><input class="in" id="dUser" placeholder="يوزر *"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input class="in" id="dPass" placeholder="باسورد *"><input class="in" id="dPhone" placeholder="واتساب *"></div><button class="btn g" onclick="addDrv()">إضافة السائق</button></div>';
var body=ks.length?ks.map(function(k){var d=DRIVERS[k];return '<div class="ord"><div class="t"><span>'+d.name+'</span><span class="bdg delivered">نشط</span></div><div class="s">🆔 '+k+' • 🔑 '+d.pass+'</div><div class="s">📱 '+d.phone+'</div><div class="act"><button class="tb danger" onclick="delDrv(\''+k+'\')">حذف</button></div></div>'}).join(''):'<p class="empty">لا سائقين</p>';
c.innerHTML=form+'<div class="card"><h3>السائقون ('+ks.length+')</h3>'+body+'</div>'}
function addDrv(){var n=$('#dName').value.trim(),u=$('#dUser').value.trim(),p=$('#dPass').value,ph=$('#dPhone').value;
if(!n||!u||!p||!ph){toast('أكمل الحقول');return}
if(DRIVERS[u]){toast('اليوزر موجود');return}
FB.ref('mufti/drivers/'+u).set({name:n,pass:p,phone:ph,ts:Date.now()}).then(function(){toast('أُضيف '+n);['dName','dUser','dPass','dPhone'].forEach(function(i){$('#'+i).value=''})})}
function delDrv(k){if(!confirm('حذف؟'))return;FB.ref('mufti/drivers/'+k).remove()}
function rVis(c){var h='<div class="card"><h3>الزوار — إجمالي الدخول: '+VCOUNT+'</h3>';
h+=VISITS.slice(0,80).map(function(v){return '<div class="ord"><div class="t"><span><b style="color:var(--navy)">'+v.name+'</b></span><span style="font-size:10px;color:var(--mut)">'+v.role+'</span></div><div class="s">'+new Date(v.ts).toLocaleString('ar-SY')+'</div></div>'}).join('')||'<p class="empty">لا زوار بعد</p>';
c.innerHTML=h+'</div>'}
function rMerch(c){var ms=Object.keys(USERS).filter(function(k){return USERS[k].role==='merchant'});

function rSet(c){c.innerHTML='<div class="card"><h3>الإعدادات</h3><label style="font-size:12px;font-weight:700;color:var(--mut)">نسبة المفتي %</label><input class="in" id="sP" type="number" value="'+(SET.percent||0)+'"><label style="font-size:12px;font-weight:700;color:var(--mut)">رسوم التوصيل</label><input class="in" id="sF" type="number" value="'+(SET.fee||0)+'"><label style="font-size:12px;font-weight:700;color:var(--mut)">واتساب الإدارة</label><input class="in" id="sW" value="'+(SET.admwa||'')+'"><label style="font-size:12px;font-weight:700;color:var(--mut)">العملة</label><select class="in" id="sC"><option value="ل.س">ل.س</option><option value="$">$ دولار</option></select><button class="btn g" onclick="saveSet()">حفظ</button></div>';$('#sC').value=SET.cur||'ل.س'}
