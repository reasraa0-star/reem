<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Mer — الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#070d1a;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#eef4fb;--mut:#8fa3bf;--cy:#22d3ee;--gd:#fbbf24;--gr:#34d399;--rd:#f87171;--bl:#60a5fa;--pu:#c084fc}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Tajawal,sans-serif;background:radial-gradient(900px 500px at 85% -100px,rgba(34,211,238,.14),transparent),radial-gradient(700px 400px at 10% 110%,rgba(251,191,36,.08),transparent),var(--bg);color:var(--txt);min-height:100dvh}
h1,h2,h3,.logo{font-family:Changa}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center}
.lc{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:36px;width:92%;max-width:400px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.logo{font-size:30px;font-weight:800;background:linear-gradient(135deg,var(--gd),var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lc p{color:var(--mut);font-size:12px;margin:6px 0 20px}
.in{width:100%;padding:12px 14px;background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:12px;color:var(--txt);font-size:14px;margin-bottom:10px;font-family:Tajawal}
.in:focus{outline:none;border-color:var(--cy)}
.btn{border:none;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;font-size:13px;font-family:Tajawal;transition:.2s}
.btn:active{transform:scale(.97)}
.b1{background:linear-gradient(135deg,var(--gd),var(--cy));color:#06202b;box-shadow:0 8px 24px rgba(34,211,238,.25)}
.b2{background:var(--card);border:1px solid var(--line);color:var(--txt)}
#app{display:none;max-width:1250px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top .logo{flex:1;font-size:24px}
.nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.nav button{flex-shrink:0;padding:10px 20px;border-radius:30px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;cursor:pointer;font-family:Tajawal}
.nav button.on{background:linear-gradient(135deg,var(--gd),var(--cy));color:#06202b;border-color:transparent}
.sec{display:none}.sec.on{display:block;animation:fin .3s}@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;overflow:hidden}
.kpi:before{content:'';position:absolute;top:0;right:0;width:46px;height:46px;border-radius:0 0 0 60px;background:linear-gradient(135deg,var(--cy),transparent);opacity:.25}
.kpi .l{font-size:11px;color:var(--mut);margin-bottom:4px}.kpi .v{font-size:20px;font-weight:800;font-family:Changa}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h3{color:var(--cy);margin-bottom:12px;font-size:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sendbar{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.sendbar select{max-width:220px;margin:0}
.tbl{width:100%;border-collapse:collapse;background:rgba(255,255,255,.97);color:#12203a;border-radius:14px;overflow:hidden}
.tbl th{background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#fff;font-size:11px;padding:10px 6px;text-align:right}
.tbl td{padding:9px 6px;font-size:12px;border-top:1px solid #e6edf5;vertical-align:middle}
.st{display:inline-block;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:800}
.st.new{background:#fee2e2;color:#b91c1c}.st.assigned{background:#fef3c7;color:#b45309}.st.accepted{background:#d1fae5;color:#047857}.st.waiting{background:#e0e7ff;color:#4338ca}.st.delivered{background:#d1fae5;color:#065f46}
.ib{border:none;border-radius:8px;padding:5px 8px;font-size:11px;cursor:pointer;margin:1px;background:#eef4fb}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0c1526;border:1px solid var(--cy);color:var(--cy);padding:10px 24px;border-radius:40px;font-weight:700;z-index:199;opacity:0;transition:.3s}.toast.on{opacity:1}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;align-items:center;justify-content:center}.modal.on{display:flex}
.mbox{background:#0c1526;border:1px solid var(--line);border-radius:20px;padding:22px;width:92%;max-width:460px;max-height:90dvh;overflow:auto}
.mbox h3{color:var(--gd)}
@media(max-width:700px){.row3,.row4{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="login"><div class="lc"><div class="logo">⚡ Flash Mer</div><p>لوحة الإدارة الفاخرة — درعا</p>
<input class="in" id="lu" placeholder="اسم المستخدم"><input class="in" id="lp" type="password" placeholder="كلمة السر">
<button class="btn b1" onclick="doLogin()">🔐 دخول</button></div></div>
<div id="app">
<div class="top"><div class="logo">⚡ Flash Mer — الإدارة</div>
<button class="btn b2" onclick="exportCSV()">📊 تصدير</button>
<button class="btn b2" style="color:var(--rd)" onclick="wipeDay()">🧹 تصفير اليوم</button>
<button class="btn b2" onclick="logout()">🚪</button></div>
<div class="nav">
<button class="on" onclick="go('o',this)">📥 الطلبات</button>
<button onclick="go('n',this)">➕ طلب جديد</button>
<button onclick="go('d',this)">🚚 السائقين</button>
<button onclick="go('m',this)">🏬 التجار</button>
<button onclick="go('r',this)">📊 الجرد</button></div>
<div class="sec on" id="s-o"><div class="kpis" id="dash"></div>
<div class="card"><h3>الطلبات الحية</h3>
<select class="in" id="flt" onchange="renderOrders()" style="max-width:200px"><option value="">الكل</option><option value="new">جديد</option><option value="assigned">مسند</option><option value="accepted">استلم</option><option value="waiting">انتظار</option><option value="delivered">مسلّم</option></select>
<div class="sendbar"><select class="in" id="sendDrv"></select><button class="btn b1" onclick="sendSelected()">📤 إرسال المحدد للسائق</button></div>
<div id="obox" style="overflow-x:auto"></div></div></div>
<div class="sec" id="s-n"><div class="card"><h3>➕ طلب جديد (إدخال سريع)</h3>
<div class="row2"><input class="in" id="n_cust" placeholder="اسم المستلم *"><input class="in" id="n_phone" placeholder="هاتف (واتساب) *"></div>
<div class="row2"><input class="in" id="n_area" placeholder="المنطقة"><input class="in" id="n_addr" placeholder="العنوان"></div>
<div class="row3"><input class="in" id="n_amt" type="number" placeholder="مبلغ التحصيل"><select class="in" id="n_type"><option value="cust">👤 زبون</option><option value="mer">🏬 تاجر</option></select><input class="in" id="n_note" placeholder="ملاحظة البضاعة"></div>
<button class="btn b1" onclick="newOrder()">⚡ إنشاء + باركود</button></div></div>
<div class="sec" id="s-d"><div class="card"><h3>➕ سائق جديد</h3>
<div class="row4"><input class="in" id="d_name" placeholder="الاسم"><input class="in" id="d_user" placeholder="يوزر"><input class="in" id="d_pass" placeholder="باسورد"><input class="in" id="d_phone" placeholder="واتساب"></div>
<button class="btn b1" onclick="addUser('driver')">🚚 إضافة سائق</button></div>
<div class="card"><h3>السائقين</h3><div id="dbox" style="overflow-x:auto"></div></div></div>
<div class="sec" id="s-m"><div class="card"><h3>➕ تاجر جديد (يدخل ويطلب)</h3>
<div class="row4"><input class="in" id="m_name" placeholder="اسم المحل/التاجر"><input class="in" id="m_user" placeholder="يوزر"><input class="in" id="m_pass" placeholder="باسورد"><input class="in" id="m_phone" placeholder="واتساب"></div>
<button class="btn b1" onclick="addUser('merchant')">🏬 إضافة تاجر</button></div>
<div class="card"><h3>التجار</h3><div id="mbox" style="overflow-x:auto"></div></div></div>
<div class="sec" id="s-r"><div class="card"><h3>📊 الجرد اليومي</h3>
<input class="in" id="r_day" type="date" onchange="renderRep()" style="max-width:220px"><div id="rbox" style="overflow-x:auto"></div></div></div>
</div>
<div class="modal" id="editM"><div class="mbox"><h3>✏️ تعديل طلب</h3>
<input class="in" id="e_cust" placeholder="الاسم"><input class="in" id="e_phone" placeholder="الهاتف">
<div class="row2"><input class="in" id="e_area" placeholder="المنطقة"><input class="in" id="e_addr" placeholder="العنوان"></div>
<div class="row2"><input class="in" id="e_amt" type="number" placeholder="المبلغ"><input class="in" id="e_eta" type="number" placeholder="وقت الوصول (دقيقة)"></div>
<input class="in" id="e_note" placeholder="ملاحظة">
<div class="row2"><button class="btn b1" onclick="saveEdit()">💾 حفظ</button><button class="btn b2" onclick="closeEdit()">إلغاء</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e",measurementId:"G-5L2R7Y2RQS"};
firebase.initializeApp(firebaseConfig);var FB=firebase.database();
var ORDERS=[],USERS={},editId=null,ST={new:'جديد',assigned:'مسند',accepted:'استلم',waiting:'انتظار',delivered:'مسلّم'};
function $(s){return document.querySelector(s)}var _t;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(_t);_t=setTimeout(function(){t.classList.remove('on')},2200)}
function today(){return new Date().toISOString().slice(0,10)}
function waNum(p){p=(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='963'+p.slice(1);return p}
function doLogin(){if($('#lu').value==='admin'&&$('#lp').value===(localStorage.getItem('fm_pass')||'1234')){sessionStorage.setItem('fm_ok','1');enter()}else toast('❌ بيانات خاطئة')}
function logout(){sessionStorage.removeItem('fm_ok');location.reload()}
function enter(){$('#login').style.display='none';$('#app').style.display='block';$('#r_day').value=today();listen()}
function go(id,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));$('#s-'+id).classList.add('on')}
function listen(){FB.ref('fm/orders').on('value',function(s){ORDERS=[];s.forEach(function(c){var o=c.val();o.id=c.key;ORDERS.push(o)});ORDERS.sort(function(a,b){return b.ts-a.ts});renderDash();renderOrders();renderRep()});
FB.ref('fm/users').on('value',function(s){USERS={};s.forEach(function(c){USERS[c.key]=c.val()});renderDrivers();renderMerchants()})}
function renderDash(){var t=ORDERS.filter(o=>o.day===today()),del=t.filter(o=>o.status==='delivered'),col=del.reduce((a,o)=>a+(+o.collected||0),0),pen=t.filter(o=>o.status!=='delivered').reduce((a,o)=>a+(+o.amount||0),0);
$('#dash').innerHTML='<div class="kpi"><div class="l">طلبات اليوم</div><div class="v" style="color:var(--cy)">'+t.length+'</div></div><div class="kpi"><div class="l">مسلّمة</div><div class="v" style="color:var(--gr)">'+del.length+'</div></div><div class="kpi"><div class="l">محصّل اليوم</div><div class="v" style="color:var(--gd)">'+col.toLocaleString()+'</div></div><div class="kpi"><div class="l">بالطريق (قيمة)</div><div class="v" style="color:var(--pu)">'+pen.toLocaleString()+'</div></div>'}
function drvOpts(sel){var h='<option value="">— توزيع —</option>';for(var k in USERS){if(USERS[k].role==='driver')h+='<option value="'+k+'"'+(sel===k?' selected':'')+'>'+USERS[k].name+'</option>'}return h}
function toggleAll(cb){document.querySelectorAll('.chk').forEach(c=>c.checked=cb.checked)}
function sendSelected(){var drv=$('#sendDrv').value;if(!drv){toast('⚠️ اختر السائق أولاً');return}
var ids=[].slice.call(document.querySelectorAll('.chk:checked')).map(c=>c.value);if(!ids.length){toast('⚠️ حدّد طلبات بالمربعات');return}
var U=USERS[drv],lines=[];
ids.forEach(function(id){var o=ORDERS.find(x=>x.id===id);
FB.ref('fm/orders/'+id).update({status:'assigned',driver:drv,driverName:U.name,driverPhone:U.phone||''});
lines.push('📦 '+o.code+' | '+o.cust+'%0A📍 '+o.area+' - '+o.addr+'%0A📞 '+o.phone+'%0A💵 تحصيل: '+(+o.amount||0).toLocaleString()+(o.loc?'%0A🗺️ '+o.loc:''))});
var msg='⚡ *Flash Mer* — مهام جديدة%0A━━━━━━━━%0A'+lines.join('%0A━━━━━━━━%0A');
window.open('https://wa.me/'+waNum(U.phone)+'?text='+msg,'_blank');
toast('📤 أُرسل '+ids.length+' للسائق '+U.name)}
function renderOrders(){$('#sendDrv').innerHTML=drvOpts();var f=$('#flt').value,L=ORDERS.filter(o=>!f||o.status===f);
$('#obox').innerHTML='<table class="tbl"><thead><tr><th><input type="checkbox" onchange="toggleAll(this)"></th><th>باركود</th><th>المستلم</th><th>هاتف</th><th>منطقة</th><th>نوع</th><th>مبلغ</th><th>سائق</th><th>وصول</th><th>حالة</th><th>إجراءات</th></tr></thead><tbody>'+L.map(function(o){return '<tr><td><input type="checkbox" class="chk" value="'+o.id+'"></td><td><b>'+o.code+'</b></td><td>'+o.cust+'</td><td dir="ltr">'+o.phone+'</td><td>'+o.area+'</td><td>'+(o.type==='mer'?'🏬':'')+'</td><td><b>'+(+o.amount||0).toLocaleString()+'</b></td><td><select class="in" style="margin:0;padding:5px" onchange="assign(\''+o.id+'\',this.value)">'+drvOpts(o.driver)+'</select></td><td><input class="in" type="number" style="margin:0;padding:5px;width:70px" value="'+(o.eta||'')+'" placeholder="د" onchange="setEta(\''+o.id+'\',this.value)"></td><td><span class="st '+o.status+'">'+ST[o.status]+'</span>'+(o.collected?'<br><small>💵 '+(+o.collected).toLocaleString()+'</small>':'')+'</td><td>'+(o.loc?'<button class="ib" onclick="window.open(\''+o.loc+'\')">📍</button>':'')+'<button class="ib" onclick="printBar(\''+o.id+'\')">🖨</button><button class="ib" onclick="openEdit(\''+o.id+'\')">✏️</button><button class="ib" onclick="delOrder(\''+o.id+'\')">🗑</button><button class="ib" onclick="waCust(\''+o.id+'\')">📤</button></td></tr>'}).join('')+'</tbody></table>'}
function assign(id,u){var o=ORDERS.find(x=>x.id===id),up={driver:u,driverName:u?USERS[u].name:'',driverPhone:u?USERS[u].phone:''};if(u&&o.status==='new')up.status='assigned';if(!u)up.status='new';FB.ref('fm/orders/'+id).update(up);toast('🚚 وزّع على '+(u?USERS[u].name:'—'))}
function setEta(id,v){FB.ref('fm/orders/'+id).update({eta:+v||0});toast('⏱ وصول: '+v+' د')}
function newOrder(){var c=$('#n_cust').value.trim(),p=$('#n_phone').value.trim();if(!c||!p){toast('⚠️ اسم وهاتف مطلوبين');return}
var ts=Date.now(),o={code:'FM'+String(ts).slice(-6),cust:c,phone:p,area:$('#n_area').value,addr:$('#n_addr').value,amount:+$('#n_amt').value||0,type:$('#n_type').value,note:$('#n_note').value,loc:'',status:'new',driver:'',eta:0,collected:0,ts:ts,day:today()};
FB.ref('fm/orders').push(o).then(function(){toast('⚡ '+o.code);printBarRaw(o);['n_cust','n_phone','n_area','n_addr','n_amt','n_note'].forEach(i=>$('#'+i).value='')})}
function openEdit(id){editId=id;var o=ORDERS.find(x=>x.id===id);$('#e_cust').value=o.cust;$('#e_phone').value=o.phone;$('#e_area').value=o.area;$('#e_addr').value=o.addr;$('#e_amt').value=o.amount;$('#e_eta').value=o.eta||'';$('#e_note').value=o.note;$('#editM').classList.add('on')}
function closeEdit(){$('#editM').classList.remove('on')}
function saveEdit(){FB.ref('fm/orders/'+editId).update({cust:$('#e_cust').value,phone:$('#e_phone').value,area:$('#e_area').value,addr:$('#e_addr').value,amount:+$('#e_amt').value||0,eta:+$('#e_eta').value||0,note:$('#e_note').value});closeEdit();toast('💾 عُدّل')}
function delOrder(id){if(!confirm('حذف الطلب نهائياً؟'))return;FB.ref('fm/orders/'+id).remove();toast('🗑 حُذف')}
function waCust(id){var o=ORDERS.find(x=>x.id===id);var msg='⚡ *Flash Mer*%0Aطلبك رقم '+o.code+'%0Aالحالة: '+ST[o.status]+'%0A'+(o.driverName?'السائق: '+o.driverName+'%0A':'')+(o.eta?'يصل خلال '+o.eta+' دقيقة%0A':'')+'المبلغ: '+(+o.amount||0).toLocaleString();
window.open('https://wa.me/'+waNum(o.phone)+'?text='+msg,'_blank')}
function printBar(id){printBarRaw(ORDERS.find(x=>x.id===id))}
function printBarRaw(o){var cv=document.createElement('canvas');JsBarcode(cv,o.code,{format:'CODE128',width:2,height:80,displayValue:true});
var w=window.open('');w.document.write('<html dir="rtl"><body style="text-align:center;font-family:Tahoma"><h2>⚡ Flash Mer</h2><p><b>'+o.cust+'</b> — '+o.area+'</p><p dir="ltr">'+o.phone+'</p><img src="'+cv.toDataURL()+'"><script>onload=function(){setTimeout(function(){print()},300)}<\/script></body></html>');w.document.close()}
function addUser(role){var pre=role==='driver'?'d':'m',n=$('#'+pre+'_name').value.trim(),u=$('#'+pre+'_user').value.trim(),p=$('#'+pre+'_pass').value,ph=$('#'+pre+'_phone').value;if(!n||!u||!p){toast('⚠️ أكمل البيانات');return}
FB.ref('fm/users/'+u).set({name:n,pass:p,phone:ph,role:role}).then(function(){toast('✅ أُضيف '+n);[pre+'_name',pre+'_user',pre+'_pass',pre+'_phone'].forEach(i=>$('#'+i).value='')})}
function renderDrivers(){var h='<table class="tbl"><thead><tr><th>الاسم</th><th>يوزر</th><th>واتساب</th><th>مهام</th><th>سلّم</th><th>حصّل</th></tr></thead><tbody>';
for(var k in USERS){var u=USERS[k];if(u.role!=='driver')continue;var mo=ORDERS.filter(o=>o.driver===k),de=mo.filter(o=>o.status==='delivered'),co=de.reduce((a,o)=>a+(+o.collected||0),0);
h+='<tr><td><b>'+u.name+'</b></td><td>'+k+'</td><td dir="ltr">'+(u.phone||'')+'</td><td>'+mo.length+'</td><td>'+de.length+'</td><td>'+co.toLocaleString()+'</td></tr>'}
$('#dbox').innerHTML=h+'</tbody></table>'}
function renderMerchants(){var h='<table class="tbl"><thead><tr><th>التاجر</th><th>يوزر</th><th>واتساب</th><th>طلباته</th></tr></thead><tbody>';
for(var k in USERS){var u=USERS[k];if(u.role!=='merchant')continue;var mo=ORDERS.filter(o=>o.user===k);
h+='<tr><td><b>'+u.name+'</b></td><td>'+k+'</td><td dir="ltr">'+(u.phone||'')+'</td><td>'+mo.length+'</td></tr>'}
$('#mbox').innerHTML=h+'</tbody></table>'}
function renderRep(){var d=$('#r_day').value,t=ORDERS.filter(o=>o.day===d),per={};
t.forEach(function(o){var k=o.driverName||'بدون سائق';per[k]=per[k]||{n:0,del:0,col:0};per[k].n++;if(o.status==='delivered'){per[k].del++;per[k].col+=(+o.collected||0)}});
var totCol=t.filter(o=>o.status==='delivered').reduce((a,o)=>a+(+o.collected||0),0);
