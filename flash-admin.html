<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Mer — الإدارة</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.5/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#0e1a2b;--card:#16263d;--line:rgba(255,255,255,.1);--txt:#eef4fb;--mut:#93a5bd;--ac:#22d3ee;--ac2:#0ea5e9;--gr:#34d399;--rd:#f87171;--or:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--txt);min-height:100dvh}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center}
.lc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px;width:92%;max-width:380px;text-align:center}
.lc h1{font-size:26px;color:var(--ac)} .lc p{color:var(--mut);font-size:12px;margin:6px 0 18px}
.in{width:100%;padding:12px;background:#0b1524;border:1.5px solid var(--line);border-radius:10px;color:var(--txt);font-size:14px;margin-bottom:10px}
.btn{border:none;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:13px}
.b1{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#04202b;width:100%}
.b2{background:var(--card);border:1px solid var(--line);color:var(--txt)}
#app{display:none;max-width:1200px;margin:0 auto;padding:12px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.top h2{flex:1;color:var(--ac);font-size:20px}
.nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.nav button{flex-shrink:0;padding:10px 16px;border-radius:24px;border:1.5px solid var(--line);background:var(--card);color:var(--mut);font-weight:700;cursor:pointer}
.nav button.on{background:var(--ac);color:#04202b;border-color:transparent}
.sec{display:none}.sec.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--ac);border-radius:12px;padding:12px}
.kpi .l{font-size:11px;color:var(--mut)}.kpi .v{font-size:17px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{color:var(--ac);margin-bottom:10px;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tbl{width:100%;border-collapse:collapse;background:#fff;color:#111;border-radius:10px;overflow:hidden}
.tbl th{background:var(--ac2);color:#fff;font-size:11px;padding:9px 6px;text-align:right}
.tbl td{padding:8px 6px;font-size:12px;border-top:1px solid #eee;vertical-align:top}
.st{display:inline-block;border-radius:12px;padding:3px 9px;font-size:10px;font-weight:800}
.st.new{background:#fee2e2;color:#b91c1c}.st.assigned{background:#fef3c7;color:#b45309}.st.accepted{background:#dbeafe;color:#1d4ed8}.st.delivered{background:#d1fae5;color:#047857}
.ib{border:none;border-radius:7px;padding:5px 8px;font-size:11px;cursor:pointer;margin:1px}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);color:var(--ac);padding:10px 20px;border-radius:40px;font-weight:700;z-index:99;opacity:0;transition:.3s}
.toast.on{opacity:1}
</style></head><body>
<div id="login"><div class="lc"><h1>⚡ Flash Mer</h1><p>لوحة الإدارة — توزيع الطلبات</p>
<input class="in" id="lu" placeholder="اسم المستخدم"><input class="in" id="lp" type="password" placeholder="كلمة السر">
<button class="btn b1" onclick="doLogin()">🔓 دخول</button></div></div>
<div id="app">
<div class="top"><h2>⚡ Flash Mer — الإدارة</h2><button class="btn b2" onclick="location.reload()">🔄</button><button class="btn b2" onclick="logout()">🚪</button></div>
<div class="nav"><button class="on" onclick="go('o',this)">📥 الطلبات</button><button onclick="go('n',this)">➕ طلب جديد</button><button onclick="go('d',this)">🚚 السائقين</button><button onclick="go('r',this)">📊 الجرد</button></div>
<div class="sec on" id="s-o"><div class="kpis" id="dash"></div>
<div class="card"><h3>الطلبات</h3><select class="in" id="flt" onchange="renderOrders()" style="max-width:200px"><option value="">الكل</option><option value="new">جديد</option><option value="assigned">مسند</option><option value="accepted">مستلم</option><option value="delivered">مسلّم</option></select><div id="obox"></div></div></div>
<div class="sec" id="s-n"><div class="card"><h3>➕ طلب جديد</h3>
<div class="row2"><input class="in" id="n_cust" placeholder="اسم المستلم *"><input class="in" id="n_phone" placeholder="هاتف المستلم *"></div>
<div class="row2"><input class="in" id="n_area" placeholder="المنطقة (درعا/الصنمين…)"><input class="in" id="n_addr" placeholder="العنوان بالتفصيل"></div>
<div class="row3"><input class="in" id="n_amt" type="number" placeholder="المبلغ المطلوب (تحصيل)"><select class="in" id="n_type"><option value="cust">زبون</option><option value="mer">تاجر</option></select><input class="in" id="n_note" placeholder="ملاحظة (بضاعة…)"></div>
<button class="btn b1" onclick="newOrder()">⚡ إنشاء + باركود</button></div></div>
<div class="sec" id="s-d"><div class="card"><h3>➕ سائق جديد (يوزر + باسورد)</h3>
<div class="row3"><input class="in" id="d_name" placeholder="الاسم"><input class="in" id="d_user" placeholder="اسم المستخدم"><input class="in" id="d_pass" placeholder="كلمة السر"></div>
<button class="btn b1" onclick="addDriver()">🚚 إضافة سائق</button></div>
<div class="card"><h3>السائقين</h3><div id="dbox"></div></div></div>
<div class="sec" id="s-r"><div class="card"><h3>📊 الجرد اليومي</h3><input class="in" id="r_day" type="date" onchange="renderRep()" style="max-width:220px"><div id="rbox"></div></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e",measurementId:"G-5L2R7Y2RQS"};
firebase.initializeApp(firebaseConfig);var FB=firebase.database();
var ORDERS=[],USERS={},ST={new:'جديد',assigned:'مسند',accepted:'مستلم',delivered:'مسلّم'};
function $(s){return document.querySelector(s)}var _t;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(_t);_t=setTimeout(function(){t.classList.remove('on')},2200)}
function today(){return new Date().toISOString().slice(0,10)}
function doLogin(){if($('#lu').value==='admin'&&$('#lp').value===(localStorage.getItem('fm_pass')||'1234')){sessionStorage.setItem('fm_ok','1');enter()}else toast('❌ بيانات خاطئة')}
function logout(){sessionStorage.removeItem('fm_ok');location.reload()}
function enter(){$('#login').style.display='none';$('#app').style.display='block';$('#r_day').value=today();listen()}
function go(id,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));$('#s-'+id).classList.add('on')}
function listen(){FB.ref('orders').on('value',function(s){ORDERS=[];s.forEach(function(c){var o=c.val();o.id=c.key;ORDERS.push(o)});ORDERS.sort(function(a,b){return b.ts-a.ts});renderDash();renderOrders();renderRep()});
FB.ref('users').on('value',function(s){USERS={};s.forEach(function(c){USERS[c.key]=c.val()});renderDrivers()})}
function renderDash(){var d=today(),t=ORDERS.filter(o=>o.day===d),del=t.filter(o=>o.status==='delivered'),col=del.reduce((a,o)=>a+(+o.collected||0),0),withD=t.filter(o=>o.status==='accepted'||o.status==='assigned').reduce((a,o)=>a+(+o.amount||0),0);
$('#dash').innerHTML='<div class="kpi"><div class="l">طلبات اليوم</div><div class="v">'+t.length+'</div></div><div class="kpi"><div class="l">مسلّمة</div><div class="v" style="color:var(--gr)">'+del.length+'</div></div><div class="kpi"><div class="l">محصّل اليوم</div><div class="v" style="color:var(--ac)">'+col.toLocaleString()+'</div></div><div class="kpi"><div class="l">مال معلّق</div><div class="v" style="color:var(--or)">'+withD.toLocaleString()+'</div></div>'}
function drvOpts(){var h='<option value="">— بدون سائق —</option>';for(var k in USERS){if(USERS[k].role==='driver')h+='<option value="'+k+'">'+USERS[k].name+'</option>'}return h}
function renderOrders(){var f=$('#flt').value,L=ORDERS.filter(o=>!f||o.status===f);
$('#obox').innerHTML='<table class="tbl"><thead><tr><th>باركود</th><th>المستلم</th><th>هاتف</th><th>المنطقة</th><th>نوع</th><th>مبلغ</th><th>سائق</th><th>حالة</th><th></th></tr></thead><tbody>'+L.map(function(o){return '<tr><td><b>'+o.code+'</b></td><td>'+o.cust+'</td><td dir="ltr">'+o.phone+'</td><td>'+o.area+'</td><td>'+(o.type==='mer'?'🏬 تاجر':'👤 زبون')+'</td><td><b>'+(+o.amount||0).toLocaleString()+'</b></td><td><select class="in" style="margin:0;padding:5px" onchange="assign(\''+o.id+'\',this.value)">'+drvOpts().replace('value="'+o.driver+'"','value="'+o.driver+'" selected')+'</select></td><td><span class="st '+o.status+'">'+ST[o.status]+'</span>'+(o.collected?'<br><small>💵 '+o.collected+'</small>':'')+'</td><td><button class="ib" style="background:#dbeafe" onclick="printBar(\''+o.id+'\')">🖨 باركود</button></td></tr>'}).join('')+'</tbody></table>'}
function assign(id,u){var up={driver:u,driverName:u?USERS[u].name:''};if(u&&ORDERS.find(o=>o.id===id).status==='new')up.status='assigned';if(!u)up.status='new';FB.ref('orders/'+id).update(up);toast('🚚 تم التوزيع')}
function newOrder(){var c=$('#n_cust').value.trim(),p=$('#n_phone').value.trim();if(!c||!p){toast('⚠️ اسم وهاتف مطلوبين');return}
var ts=Date.now(),o={code:'FM'+String(ts).slice(-6),cust:c,phone:p,area:$('#n_area').value,addr:$('#n_addr').value,amount:+$('#n_amt').value||0,type:$('#n_type').value,note:$('#n_note').value,status:'new',driver:'',collected:0,ts:ts,day:today()};
FB.ref('orders').push(o).then(function(r){toast('⚡ أُنشئ '+o.code);printBarRaw(o.code,o);['n_cust','n_phone','n_area','n_addr','n_amt','n_note'].forEach(i=>$('#'+i).value='')})}
function printBar(id){var o=ORDERS.find(x=>x.id===id);printBarRaw(o.code,o)}
function printBarRaw(code,o){var cv=document.createElement('canvas');JsBarcode(cv,code,{format:'CODE128',width:2,height:80,displayValue:true});
var w=window.open('');w.document.write('<html dir="rtl"><body style="text-align:center;font-family:Tahoma"><h2>⚡ Flash Mer</h2><p><b>'+o.cust+'</b> — '+o.area+'</p><p>'+o.phone+'</p><img src="'+cv.toDataURL()+'"><script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script></body></html>');w.document.close()}
function addDriver(){var n=$('#d_name').value.trim(),u=$('#d_user').value.trim(),p=$('#d_pass').value;if(!n||!u||!p){toast('⚠️ أكمل البيانات');return}
FB.ref('users/'+u).set({name:n,pass:p,role:'driver'}).then(function(){toast('🚚 أُضيف '+n);['d_name','d_user','d_pass'].forEach(i=>$('#'+i).value='')})}
function renderDrivers(){var h='<table class="tbl"><thead><tr><th>الاسم</th><th>اليوزر</th><th>طلباته</th><th>سلّم</th><th>حصّل</th></tr></thead><tbody>';
for(var k in USERS){var u=USERS[k];if(u.role!=='driver')continue;var mo=ORDERS.filter(o=>o.driver===k),de=mo.filter(o=>o.status==='delivered'),co=de.reduce((a,o)=>a+(+o.collected||0),0);
h+='<tr><td><b>'+u.name+'</b></td><td>'+k+'</td><td>'+mo.length+'</td><td>'+de.length+'</td><td>'+co.toLocaleString()+'</td></tr>'}
$('#dbox').innerHTML=h+'</tbody></table>'}
function renderRep(){var d=$('#r_day').value,t=ORDERS.filter(o=>o.day===d);
var per={};t.forEach(function(o){var k=o.driverName||'بدون سائق';per[k]=per[k]||{n:0,del:0,col:0};per[k].n++;if(o.status==='delivered'){per[k].del++;per[k].col+=(+o.collected||0)}});
var totCol=t.filter(o=>o.status==='delivered').reduce((a,o)=>a+(+o.collected||0),0),mer=t.filter(o=>o.type==='mer').length;
var h='<div class="kpis"><div class="kpi"><div class="l">إجمالي اليوم</div><div class="v">'+t.length+'</div></div><div class="kpi"><div class="l">تجار</div><div class="v">'+mer+'</div></div><div class="kpi"><div class="l">زبائن</div><div class="v">'+(t.length-mer)+'</div></div><div class="kpi"><div class="l">المحصّل</div><div class="v">'+totCol.toLocaleString()+'</div></div></div>';
h+='<table class="tbl"><thead><tr><th>السائق</th><th>طلبات</th><th>سلّم</th><th>حصّل</th></tr></thead><tbody>'+Object.keys(per).map(k=>'<tr><td><b>'+k+'</b></td><td>'+per[k].n+'</td><td>'+per[k].del+'</td><td>'+per[k].col.toLocaleString()+'</td></tr>').join('')+'</tbody></table>';
h+='<h3 style="margin:12px 0 8px;color:var(--ac)">تفصيل الطلبات</h3><table class="tbl"><thead><tr><th>باركود</th><th>المستلم</th><th>سائق</th><th>حالة</th><th>مبلغ</th><th>محصل</th></tr></thead><tbody>'+t.map(o=>'<tr><td>'+o.code+'</td><td>'+o.cust+'</td><td>'+(o.driverName||'—')+'</td><td><span class="st '+o.status+'">'+ST[o.status]+'</span></td><td>'+(+o.amount||0).toLocaleString()+'</td><td>'+(+o.collected||0).toLocaleString()+'</td></tr>').join('')+'</tbody></table>';
$('#rbox').innerHTML=h}
if(sessionStorage.getItem('fm_ok'))enter();
</script></body></html>
