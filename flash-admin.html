<div class="modal" id="editM"><div class="mbox"><h3>تعديل طلب</h3>

<script>
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e",measurementId:"G-5L2R7Y2RQS"};
firebase.initializeApp(firebaseConfig);var FB=firebase.database();
var ORDERS=[],USERS={},PAYS=[],ADMIN_CRED=null,SET={},editId=null,EDIT_WIN=3*60000,CUR='usd';
var ST={new:'جديد',assigned:'مسند',accepted:'استلم',waiting:'انتظار',delivered:'مسلّم'};
function $(s){return document.querySelector(s)}
var _t;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(_t);_t=setTimeout(function(){t.classList.remove('on')},2600)}
function today(){return new Date().toISOString().slice(0,10)}

function notify(t,b){if('Notification' in window&&Notification.permission==='granted'){navigator.serviceWorker&&navigator.serviceWorker.ready.then(function(r){r.showNotification(t,{body:b,icon:'flash-icon-512.png'})}).catch(function(){});}try{navigator.vibrate([200,100,200])}catch(e){}beep()}
document.addEventListener('click',function once(){if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();document.removeEventListener('click',once)});

function doLogin(){var au=ADMIN_CRED?ADMIN_CRED.user:'admin',ap=ADMIN_CRED?ADMIN_CRED.pass:'1234';

function go(id,b){document.querySelectorAll('.nav button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.querySelectorAll('.sec').forEach(function(x){x.classList.remove('on')});$('#s-'+id).classList.add('on')}
function listen(){FB.ref('fm/orders').on('value',function(s){ORDERS=[];s.forEach(function(c){var o=c.val();o.id=c.key;ORDERS.push(o)});ORDERS.sort(function(a,b){return b.ts-a.ts});renderDash();renderOrders();renderRep();renderDrivers()});

FB.ref('fm/payments').on('value',function(s){PAYS=[];s.forEach(function(c){var p=c.val();p.id=c.key;PAYS.push(p)});renderPays();renderRep();renderDrivers()});

function fillSet(){if(ADMIN_CRED){$('#s_user').value=ADMIN_CRED.user||'admin'}
CUR=SET.cur||'usd';$('#curSel').value=CUR;
$('#s_fb').value=SET.fb||'';$('#s_ig').value=SET.ig||'';$('#s_tg').value=SET.tg||'';$('#s_wa').value=SET.wa||'';$('#s_admwa').value=SET.admwa||''}
function saveCred(){var u=$('#s_user').value.trim(),p=$('#s_pass').value.trim();

FB.ref('fm/admin').set({user:u,pass:p}).then(function(){ADMIN_CRED={user:u,pass:p};$('#s_pass').value='';toast('تم الحفظ — الدخول هلأ بيوزر: '+u)})}
function saveSet(){FB.ref('fm/settings').set({cur:CUR,fb:$('#s_fb').value.trim(),ig:$('#s_ig').value.trim(),tg:$('#s_tg').value.trim(),wa:$('#s_wa').value.trim(),admwa:$('#s_admwa').value.trim()}).then(function(){toast('حُفظ')})}
function fillDrv(){var h='<option value="">— توزيع —</option>',hp='<option value="">— السائق —</option>';for(var k in USERS){if(USERS[k].role==='driver'){h+='<option value="'+k+'">'+USERS[k].name+'</option>';hp+='<option value="'+k+'">'+USERS[k].name+'</option>'}}$('#sendDrv').innerHTML=h;$('#p_drv').innerHTML=hp}
function drvOpts(sel){var h='<option value="">— توزيع —</option>';for(var k in USERS){if(USERS[k].role==='driver')h+='<option value="'+k+'"'+(sel===k?' selected':'')+'>'+USERS[k].name+'</option>'}return h}

var colU=sumC(del,function(o){return o.collected},function(o){return o.cur||'usd'},'usd'),colS=sumC(del,function(o){return o.collected},function(o){return o.cur||'usd'},'syp');
var pen=t.filter(function(o){return o.status!=='delivered'});

function toggleAll(cb){document.querySelectorAll('.chk').forEach(function(c){c.checked=cb.checked})}

function drvMsg(o){return '⚡ *Flash Mer* — مهمة جديدة%0A📦 '+o.code+' | '+o.cust+'%0A'+(o.src==='shop'?'🛒 تسوق للزبون':'🏪 من عندنا')+'%0A📍 '+o.area+' - '+o.addr+(o.loc?'%0A🗺️ الخريطة: '+o.loc:'')+'%0A📞 '+o.phone+'%0A💵 تحصيل: '+f2(o.amount)+(o.note?'%0A📝 '+o.note:'')}
