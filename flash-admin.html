<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Mer Administration</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        :root{--navy:#0b1f3a;--navy2:#123055;--gold:#c9a24b;--gold2:#e0be6e;--cy:#22d3ee;--gr:#10b981;--rd:#ef4444;--wa:#25d366;--bg:#081226;--txt:#eef2f8;--mut:#8a94a6;--line:rgba(201,162,75,.25)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Tajawal';background:var(--bg);color:var(--txt);min-height:100vh}
        
        #loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2));z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
        .loginBox{background:var(--bg);border:2px solid var(--gold);border-radius:24px;padding:40px;width:100%;max-width:420px}
        .loginBox h1{font-family:'Cairo';font-size:28px;font-weight:900;color:var(--gold2);text-align:center;margin-bottom:8px}
        .inputGroup{margin-bottom:16px}
        .inputGroup label{display:block;color:var(--gold2);font-size:11px;font-weight:800;margin-bottom:6px}
        .inputGroup input{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:rgba(10,31,58,.8);color:var(--txt);font-size:14px}
        .loginBtn{width:100%;padding:14px;border-radius:12px;border:none;background:var(--gold);color:var(--navy);font-family:'Cairo';font-weight:900;cursor:pointer}
        
        #mainApp{display:none;min-height:100vh;padding:20px}
        .header{background:var(--navy);padding:16px 20px;border-bottom:2px solid var(--gold);display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
        .header .brand{font-family:'Cairo';font-size:20px;font-weight:900;color:var(--gold2)}
        .logoutBtn{padding:8px 16px;border:1.5px solid var(--rd);background:transparent;color:var(--rd);border-radius:8px;cursor:pointer}
        
        .statsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
        .statBox{background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:14px;padding:18px;text-align:center}
        .statBox .value{font-size:24px;font-weight:900;color:var(--gold2)}
        .statBox .label{font-size:11px;color:var(--mut)}
        
        .section{background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
        .sectionTitle{font-family:'Cairo';font-size:16px;color:var(--gold2);margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:8px}
        
        .inputField{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:rgba(10,31,58,.8);color:var(--txt);margin-bottom:10px}
        .actionBtn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--gold);color:var(--navy);font-weight:900;cursor:pointer;margin-top:10px}
        
        .orderCard{background:rgba(0,0,0,.3);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;position:relative}
        .orderTop{display:flex;justify-content:space-between;margin-bottom:12px}
        .orderCode{font-weight:900;color:var(--gold2)}
        .orderStatus{padding:6px 16px;border-radius:20px;font-size:12px}
        .status-new{background:rgba(251,191,36,.2);color:#fbbf24}
        
        .orderInfo{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px;font-size:13px}
        .infoRow{color:var(--mut)}
        .infoRow strong{color:var(--txt)}
        
        .orderActions{display:flex;gap:8px;flex-wrap:wrap}
        .orderActions button{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-weight:800}
        .btnPrimary{background:var(--gold);color:var(--navy)}
        .btnWhatsApp{background:var(--wa);color:#fff}
        .btnSystem{background:var(--cy);color:var(--navy)}
        .btnDanger{background:var(--rd);color:#fff}
        
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;align-items:center;justify-content:center;padding:20px}
        .modal.active{display:flex}
        .modalContent{background:var(--navy);border:2px solid var(--gold);border-radius:20px;padding:24px;width:100%;max-width:500px}
        .modalHeader{display:flex;justify-content:space-between;margin-bottom:16px}
        .closeBtn{background:none;border:none;color:var(--mut);font-size:24px;cursor:pointer}
        
        .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold2);padding:12px 26px;border-radius:30px;border:1.5px solid var(--gold);opacity:0;transition:.4s}
        .toast.show{opacity:1}
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="loginBox">
        <h1>Flash Mer</h1>
        <div style="color:var(--mut);text-align:center;margin-bottom:20px">Administration Panel</div>
        <div class="inputGroup"><label>اسم المستخدم</label><input type="text" id="loginUser"></div>
        <div class="inputGroup"><label>كلمة المرور</label><input type="password" id="loginPass"></div>
        <button class="loginBtn" onclick="doLogin()">دخول للنظام</button>
        <div id="loginError" style="color:var(--rd);text-align:center;margin-top:12px;display:none">بيانات خاطئة</div>
    </div>
</div>

<div id="mainApp">
    <div class="header">
        <div class="brand">Flash Mer Administration</div>
        <button class="logoutBtn" onclick="doLogout()">خروج</button>
    </div>
    
    <div class="statsGrid">
        <div class="statBox"><div class="value" id="statNew">0</div><div class="label">طلبات جديدة</div></div>
        <div class="statBox"><div class="value" id="statProg">0</div><div class="label">قيد التنفيذ</div></div>
        <div class="statBox"><div class="value" id="statDone">0</div><div class="label">مسلّمة اليوم</div></div>
        <div class="statBox"><div class="value" id="statRev">0</div><div class="label">إيرادات اليوم</div></div>
    </div>
    
    <div class="section">
        <div class="sectionTitle">إنشاء طلب جديد</div>
        <input class="inputField" id="pCode" placeholder="رقم الطلب">
        <input class="inputField" id="pMerchant" placeholder="اسم التاجر *">
        <input class="inputField" id="pCustomerPhone" placeholder="رقم هاتف الزبون *">
        <input class="inputField" id="pArea" placeholder="المنطقة *">
        <input class="inputField" id="pAddr" placeholder="العنوان *">
        <input class="inputField" id="pAmount" placeholder="المبلغ *">
        <button class="actionBtn" onclick="createOrder()">إنشاء الطلب</button>
    </div>
    
    <div class="section">
        <div class="sectionTitle">الطلبات المسجلة</div>
        <div id="ordersList"></div>
    </div>
</div>

<div class="modal" id="assignModal">
    <div class="modalContent">
        <div class="modalHeader">
            <div style="font-weight:900;color:var(--gold2)">إسناد الطلب للسائق</div>
            <button class="closeBtn" onclick="closeModal()">×</button>
        </div>
        <input type="hidden" id="assignOrderId">
        <div class="inputGroup"><label>اختر السائق</label><select class="inputField" id="assignDriver"></select></div>
        <div class="inputGroup"><label>طريقة الإرسال</label>
            <select class="inputField" id="sendMethod">
                <option value="whatsapp">إرسال عبر واتساب</option>
                <option value="system">إرسال عبر النظام</option>
            </select>
        </div>
        <button class="actionBtn" onclick="confirmAssign()">تأكيد الإسناد</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e"};
firebase.initializeApp(firebaseConfig);
var FB=firebase.database();
var ORDERS=[],DRIVERS=[],currentUser=null;

function $(id){return document.getElementById(id)}

function doLogin(){
    var u=$('loginUser').value.trim(),p=$('loginPass').value;
    if(!u||!p){showToast('أدخل البيانات');return}
    FB.ref('fm/admin').once('value').then(function(s){
        var admin=s.val();
        if(admin&&admin.user===u&&admin.pass===p){
            currentUser=u;
            $('loginScreen').style.display='none';
            $('mainApp').style.display='block';
            initApp();
            showToast('مرحباً '+u);
        }else{
            $('loginError').style.display='block';
            setTimeout(function(){$('loginError').style.display='none'},3000);
        }
    });
}

function doLogout(){
    currentUser=null;
    $('mainApp').style.display='none';
    $('loginScreen').style.display='flex';
}

function initApp(){
    FB.ref('fm/orders').on('value',function(s){
        ORDERS=[];
        s.forEach(function(c){var o=c.val();o.id=c.key;ORDERS.push(o)});
        renderOrders();
        updateStats();
    });
    FB.ref('fm/drivers').on('value',function(s){
        DRIVERS=[];
        s.forEach(function(c){var d=c.val();d.id=c.key;DRIVERS.push(d)});
    });
}

function updateStats(){
    $('statNew').textContent=ORDERS.filter(function(o){return o.status==='new'}).length;
    $('statProg').textContent=ORDERS.filter(function(o){return o.status==='assigned'||o.status==='waiting'}).length;
    $('statDone').textContent=ORDERS.filter(function(o){return o.status==='delivered'}).length;
}

function createOrder(){
    var code=$('pCode').value.trim()||('FM'+Date.now().toString().slice(-6));
    var merchant=$('pMerchant').value.trim();
    var customerPhone=$('pCustomerPhone').value.trim();
    var area=$('pArea').value.trim();
    var addr=$('pAddr').value.trim();
    var amount=parseFloat($('pAmount').value)||0;
    
    if(!merchant||!customerPhone||!area||!addr||!amount){
        showToast('البيانات الإجبارية ناقصة');
        return;
    }
    
    FB.ref('fm/orders').push({
        code:code,
        merchant:merchant,
        customerPhone:customerPhone,
        area:area,
        addr:addr,
        amount:amount,
        status:'new',
        driver:'',
        ts:Date.now()
    });
    
    showToast('تم إنشاء '+code);
    $('pCode').value='';
    $('pMerchant').value='';
    $('pCustomerPhone').value='';
    $('pArea').value='';
    $('pAddr').value='';
    $('pAmount').value='';
}

function renderOrders(){
    $('ordersList').innerHTML=ORDERS.sort(function(a,b){return (b.ts||0)-(a.ts||0)}).map(function(o){
        return '<div class="orderCard">'+
            '<div class="orderTop">'+
                '<div class="orderCode">'+(o.code||'—')+'</div>'+
                '<div class="orderStatus status-'+(o.status||'new')+'">'+getStatusText(o.status)+'</div>'+
            '</div>'+
            '<div class="orderInfo">'+
                '<div class="infoRow">التاجر: <strong>'+(o.merchant||'—')+'</strong></div>'+
                '<div class="infoRow">هاتف الزبون: <strong>'+(o.customerPhone||o.phone||'—')+'</strong></div>'+
                '<div class="infoRow">المنطقة: <strong>'+o.area+'</strong></div>'+
                '<div class="infoRow">العنوان: <strong>'+o.addr+'</strong></div>'+
                '<div class="infoRow">المبلغ: <strong>'+fmt(o.amount)+'</strong></div>'+
            '</div>'+
            '<div class="orderActions">'+
                (o.status==='new'?'<button class="btnPrimary" onclick="openAssign(\''+o.id+'\')">إسناد</button>':'')+
                '<button class="btnDanger" onclick="deleteOrder(\''+o.id+'\')">حذف</button>'+
            '</div>'+
        '</div>';
    }).join('')||'<div style="text-align:center;color:var(--mut);padding:40px">لا توجد طلبات</div>';
}

function getStatusText(s){
    var t={new:'جديد',assigned:'مسند',waiting:'قيد الانتظار',delivered:'مسلّم'};
    return t[s]||s;
}

function fmt(v){return Number(v||0).toLocaleString('en-US')+' ل.س'}

function openAssign(id){
    $('assignOrderId').value=id;
    $('assignDriver').innerHTML=DRIVERS.map(function(d){
        return '<option value="'+d.user+'">'+d.name+' ('+d.phone+')</option>';
    }).join('')||'<option>لا سائقين</option>';
    $('assignModal').classList.add('active');
}

function confirmAssign(){
    var id=$('assignOrderId').value;
    var driver=$('assignDriver').value;
    var method=$('sendMethod').value;
    
    if(!driver){showToast('اختر سائق');return}
    
    var order=ORDERS.find(function(o){return o.id===id});
    if(!order){showToast('الطلب غير موجود');return}
    
    FB.ref('fm/orders/'+id).update({
        status:'assigned',
        driver:driver,
        sendMethod:method,
        assignedAt:Date.now()
    });
    
    if(method==='whatsapp'){
        sendWhatsApp(driver,order);
    }
    
    showToast('تم الإسناد - طريقة الإرسال: '+(method==='whatsapp'?'واتساب':'النظام'));
    closeModal();
}

function sendWhatsApp(driverUser,order){
    var driver=DRIVERS.find(function(d){return d.user===driverUser});
    if(!driver||!driver.phone){showToast('لا يوجد رقم واتساب للسائق');return}
    
    var msg='*Flash Mer - طلب جديد*\n\n';
    msg+='رقم الطلب: '+(order.code||'—')+'\n';
    msg+='هاتف الزبون: '+(order.customerPhone||order.phone||'—')+'\n';
    msg+='المنطقة: '+order.area+'\n';
    msg+='العنوان: '+order.addr+'\n';
    msg+='المبلغ: '+fmt(order.amount);
    
    var cleanPhone=driver.phone.replace(/^0/,'963').replace(/[\s\+\-]/g,'');
    var url='https://wa.me/'+cleanPhone+'?text='+encodeURIComponent(msg);
    window.open(url,'_blank');
}

function deleteOrder(id){
    if(!confirm('حذف الطلب؟'))return;
    FB.ref('fm/orders/'+id).remove();
    showToast('تم الحذف');
}

function closeModal(){
    $('assignModal').classList.remove('active');
}

function showToast(m){
    var t=$('toast');
    t.textContent=m;
    t.classList.add('show');
    setTimeout(function(){t.classList.remove('show')},2800);
}

$('loginScreen').style.display='flex';
</script>

</body>
</html>
