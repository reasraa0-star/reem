ba(0,0,0,.35);border:1.5px solid var(--line);border-radius:12px;color:var(--txt);font-size:13px;margin-bottom:9px}.btn{border:none;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;font-size:13px}.b1{background:linear-gradient(135deg,var(--gd),var(--cy));color:#06202b}.b2{background:var(--card);border:1px solid var(--line);color:var(--txt)}#app{display:none;max-width:1250px;margin:0 auto;padding:14px}.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top .logo{flex:1;font-size:22px}.hb{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;gap:4px}.hb i{display:block;width:20px;height:2.5px;background:var(--gd);border-radius:2px}.ovl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;opacity:0;visibility:hidden;transition:.3s}.ovl.on{opacity:1;visibility:visible}.drw{position:fixed;top:0;bottom:0;right:0;width:280px;background:#0c1526;border-left:1px solid var(--line);z-index:90;transform:translateX(100%);transition:.35s;padding:22px 16px;display:flex;flex-direction:column;overflow:auto}.drw.on{transform:none}.drw .dh{font-family:'Changa';color:var(--gd);font-size:20px;letter-spacing:1px;padding:4px 4px 16px;border-bottom:2px solid var(--gd);margin-bottom:16px}.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dgrid a{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 6px;display:flex;align-items:center;justify-content:center;color:var(--txt);font-family:'Changa';font-weight:700;font-size:14px;letter-spacing:.5px;cursor:pointer;transition:.2s}.dgrid a.on{border-color:var(--gd);color:var(--gd);background:rgba(251,191,36,.08)}.drw .out{margin-top:16px;color:var(--rd);border:1.5px solid rgba(248,113,113,.3);border-radius:14px;padding:13px;text-align:center;font-family:'Changa';font-weight:700;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.kpi.click{cursor:pointer;border-color:var(--gd)}.kpi .l{font-size:10px;color:var(--mut)}.kpi .v{font-size:17px;font-weight:800;font-family:'Changa'}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.card h3{margin-bottom:12px;font-size:15px}.h-new{color:var(--cy)}.h-way{color:var(--gd)}.h-del{color:var(--gr)}.h-pay{color:var(--gd)}.h-set{color:var(--rd)}.h-vis{color:var(--cy)}.h-arc{color:var(--rd)}.h-edt{color:var(--pu)}.h-rep{color:var(--cy)}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sendbar{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}.sendbar select{max-width:220px;margin:0}.sendbar label{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12px;font-weight:700}.chk,.chk2,.chk3{width:17px;height:17px;accent-color:var(--gd);cursor:pointer}.ord{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}.ord .t{font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.ord .s{font-size:12px;color:var(--mut);margin:4px 0}.st{display:inline-block;border-radius:20px;padding:3px 9px;font-size:9px;font-weight:800}.st.new{background:#fee2e2;color:#b91c1c}.st.assigned{background:#fef3c7;color:#b45309}.st.accepted{background:#e0e7ff;color:#4338ca}.st.waiting{background:#fef3c7;color:#b45309}.st.delivered{background:#d1fae5;color:#065f46}.ed{display:inline-block;background:rgba(192,132,252,.15);color:var(--pu);border-radius:8px;padding:2px 8px;font-size:9px;font-weight:800;margin-right:4px}.ib{border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:800;cursor:pointer;margin:1px;background:#eef4fb;color:#12203a}.ib.gold{background:linear-gradient(135deg,var(--gd),var(--cy));color:#06202b}.ib.danger{background:#fee2e2;color:#b91c1c}.ib.purple{background:#e0e7ff;color:#4338ca}.ib.green{background:#d1fae5;color:#065f46}.pos{color:#047857;font-weight:800}.neg{color:#b91c1c;font-weight:800}.tbl{width:100%;border-collapse:collapse;background:rgba(255,255,255,.97);color:#12203a;border-radius:14px;overflow:hidden}.tbl th{background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#fff;font-size:10px;padding:8px 5px;text-align:right}.tbl td{padding:7px 5px;font-size:11px;border-top:1px solid #e6edf5}.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#0c1526;border:1px solid var(--cy);color:var(--cy);padding:10px 24px;border-radius:40px;font-weight:700;z-index:250;opacity:0;transition:.3s}.toast.on{opacity:1}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;align-items:center;justify-content:center}.modal.on{display:flex}.mbox{background:#0c1526;border:1px solid var(--line);border-radius:20px;padding:22px;width:92%;max-width:520px;max-height:90dvh;overflow:auto}.mbox h3{color:var(--gd)}.drow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}.drow .k{color:var(--mut)}.drow .v{font-weight:800}

<script>
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e",measurementId:"G-5L2R7Y2RQS"};
firebase.initializeApp(firebaseConfig);var FB=firebase.database();
var ORDERS=[],USERS=[],PAYS=[],VISITS=[],VCOUNT=0,SET={},editId=null,CUR='usd',curV='o';
var ST={new:'جديد',assigned:'مسند',accepted:'مستلم',waiting:'انتظار',delivered:'مسلّم'};
function $(s){return document.querySelector(s)}
var _t;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(_t);_t=setTimeout(function(){t.classList.remove('on')},2600)}
function today(){return new Date().toISOString().slice(0,10)}
/* العملة مثبّتة لكل طلب: دولار يضل دولار وسوري يضل سوري */
function f2(n,c){var cc=c||'usd';var v=Number(n||0).toLocaleString('en-US');return cc==='syp'?v+' ل.س':'$'+v}
function sumC(a,vf,cf,c){return a.reduce(function(s,x){return s+(((cf(x)||'usd')===c)?(+vf(x)||0):0)},0)}
function waNum(p){p=(p||'').replace(/\D/g,'');if(p.startsWith('0'))p='963'+p.slice(1);return p}
/* اختصارات التطبيق المثبت تفتح قسمها مباشرة */
function hashView(){var h=location.hash||'';
if(h.indexOf('orders')>=0)return 'o';
if(h.indexOf('drivers')>=0)return 'd';
if(h.indexOf('shops')>=0)return 'm';
if(h.indexOf('inv')>=0)return 'rep';
return null}
var WTEXT='أهلاً بكم في فلاش مير. شعارنا الثقة، الدقة، المصداقية، والأمانة. نوصل طلبك بأمانة.';
function speakWelcome(){try{if(!('speechSynthesis' in window))return;
var say=function(){var u=new SpeechSynthesisUtterance(WTEXT);u.lang='ar-SA';u.rate=0.95;
var vs=speechSynthesis.getVoices();var ar=null;for(var i=0;i<vs.length;i++){if(vs[i].lang&&vs[i].lang.indexOf('ar')===0){ar=vs[i];break}}
if(ar)u.voice=ar;speechSynthesis.cancel();speechSynthesis.speak(u);};
if(speechSynthesis.getVoices().length)say();else{speechSynthesis.onvoiceschanged=say;setTimeout(say,400)}}catch(e){}}
var fsDone=false;function endFS(say){if(fsDone)return;fsDone=true;if(say)speakWelcome();$('#fsplash').classList.add('off');setTimeout(function(){var d=$('#fsplash');if(d)d.remove()},700)}
setTimeout(function(){endFS(false)},6000);
function openDrw(){$('#drw').classList.add('on');$('#ovl').classList.add('on')}
function closeDrw(){$('#drw').classList.remove('on');$('#ovl').classList.remove('on')}
function go(v){curV=v;closeDrw();var as=document.querySelectorAll('.dgrid a');for(var i=0;i<as.length;i++)as[i].classList.toggle('on',as[i].dataset.v===v);render()}
window.addEventListener('hashchange',function(){var v=hashView();if(v&&$('#app').style.display==='block')go(v)});
function ok(){sessionStorage.setItem('fm_ok','1');enter()}
function doLogin(){var u=$('#lu').value.trim(),p=$('#lp').value;
var saved=localStorage.getItem('fm_cred');
if(saved){try{var c=JSON.parse(saved);if(u===c.user&&p===c.pass){ok();return}}catch(e){}}
if(u==='admin'&&p==='1234'){ok();return}
FB.ref('fm/admin').once('value').then(function(s){var d=s.val()||{};
if(u===(d.user||'admin')&&p===(d.pass||'1234')){ok()}else toast('❌ بيانات غير صحيحة')}).catch(function(){toast('❌ خطأ اتصال')})}
function logout(){sessionStorage.removeItem('fm_ok');location.reload()}
function enter(){$('#login').style.display='none';$('#app').style.display='block';speakWelcome();listen();go(hashView()||'o')}
function listen(){
FB.ref('fm/orders').on('value',function(s){ORDERS=[];s.forEach(function(c){var o=c.val();o.id=c.key;ORDERS.push(o)});ORDERS.sort(function(a,b){return b.ts-a.ts});render()});
FB.ref('fm/users').on('value',function(s){USERS={};s.forEach(function(c){USERS[c.key]=c.val()});render()});
FB.ref('fm/payments').on('value',function(s){PAYS=[];s.forEach(function(c){var p=c.val();p.id=c.key;PAYS.push(p)});render()});
FB.ref('fm/visits').on('value',function(s){VISITS=[];s.forEach(function(c){VISITS.push(c.val())});VISITS.sort(function(a,b){return b.ts-a.ts});render()});
FB.ref('fm/visitsCount').on('value',function(s){VCOUNT=s.val()||0;render()});
FB.ref('fm/settings').on('value',function(s){if(s.val())SET=s.val()})}
function live(){return ORDERS.filter(function(o){return !o.deleted})}
function render(){renderDash();var c=$('#content');
if(curV==='o')rOrders(c);else if(curV==='n')rNew(c);else if(curV==='d')rDrv(c);else if(curV==='p')rPay(c);else if(curV==='m')rMer(c);else if(curV==='rep')rRep(c);else if(curV==='del')rDel(c);else if(curV==='edt')rEdt(c);else if(curV==='arc')rArc(c);else if(curV==='v')rVis(c);else rSet(c)}
function renderDash(){var L=live(),t=L.filter(function(o){return o.day===today()}),del=t.filter(function(o){return o.status==='delivered'});
$('#dash').innerHTML='<div class="kpi click" onclick="openToday()"><div class="l">طلبات اليوم</div><div class="v" style="color:var(--cy)">'+t.length+'</div></div><div class="kpi"><div class="l">مسلّمة</div><div class="v" style="color:var(--gr)">'+del.length+'</div></div><div class="kpi"><div class="l">الزوار</div><div class="v" style="color:var(--pu)">'+VCOUNT+'</div></div><div class="kpi"><div class="l">جديدة</div><div class="v" style="color:var(--gd)">'+L.filter(function(o){return o.status==='new'}).length+'</div></div>'}
function drvOpts(sel){var h='<option value="">— اختر سائق —</option>';for(var k in USERS){if(USERS[k].role==='driver')h+='<option value="'+k+'"'+(sel===k?' selected':'')+'>'+USERS[k].name+'</option>'}return h}
function drvMsg(o){return '⚡ *Flash Mer* — مهمة جديدة%0A📦 '+o.code+' | '+o.cust+'%0A'+(o.src==='shop'?'🛒 تسوق':'🏪 من عندنا')+'%0A📍 '+o.area+' - '+o.addr+(o.loc?'%0A🗺️ '+o.loc:'')+'%0A📞 '+o.phone+'%0A💵 تحصيل: '+f2(o.amount,o.cur)+(o.note?'%0A📝 '+o.note:'')}
function toggleAll(cb){var cs=document.querySelectorAll('.chk');for(var i=0;i<cs.length;i++)cs[i].checked=cb.checked}
function toggleAll2(cb){var cs=document.querySelectorAll('.chk2');for(var i=0;i<cs.length;i++)cs[i].checked=cb.checked}
function toggleAll3(cb){var cs=document.querySelectorAll('.chk3');for(var i=0;i<cs.length;i++)cs[i].checked=cb.checked}
function sendSel(selId,cls){var drv=$(selId).value;if(!drv){toast('⚠️ اختر السائق');return}
var cs=document.querySelectorAll('.'+cls+':checked');var ids=[];for(var i=0;i<cs.length;i++)ids.push(cs[i].value);
if(!ids.length){toast('⚠️ حدّد');return}
var U=USERS[drv],lines=[];
ids.forEach(function(id){var o=ORDERS.find(function(x){return x.id===id});
FB.ref('fm/orders/'+id).update({status:'assigned',driver:drv,driverName:U.name,driverPhone:U.phone||''});
lines.push(drvMsg(o))});
window.open('https://wa.me/'+waNum(U.phone)+'?text='+'⚡ *Flash Mer* — مهام جديدة%0A━━━━━━━━%0A'+lines.join('%0A━━━━━━━━%0A'),'_blank');
toast('📤 أُرسل '+ids.length)}
function sendSelected(){sendSel('#sendDrv','chk')}
function sendSelected2(){sendSel('#sendDrv2','chk3')}
function acceptOrder(id){var o=ORDERS.find(function(x){return x.id===id});if(!o)return;
FB.ref('fm/orders/'+id).update({status:'accepted'}).then(function(){
window.open('https://wa.me/'+waNum(o.phone)+'?text='+'✅ *Flash Mer*%0Aتم استلام طلبك '+(o.code||'')+'%0Aسيتم توصيل طلبك، وسيتواصل معك السائق على واتساب.%0Aتابع طلبك على التطبيق أو الموقع أو واتساب.','_blank');
toast('✅ استلام + إبلاغ الزبون')})}
function setO(id,st){FB.ref('fm/orders/'+id).update({status:st});toast('تم: '+ST[st])}
function deliverNow(id){if(!confirm('تأكيد تسليم الطلب للمستلم؟'))return;FB.ref('fm/orders/'+id).update({status:'delivered'}).then(function(){toast('✅ تم التسليم')})}
/* الأزرار حسب الحالة: الاستلام بيختفي بعد الاستلام، والطريق مقفول لحد التسليم */
function acts(o){var h='<button class="ib gold" onclick="openDetails(\''+o.id+'\')">تفاصيل</button><button class="ib" onclick="printBar(\''+o.id+'\')">باركود</button>';
if(o.status==='new'){h+='<button class="ib green" onclick="acceptOrder(\''+o.id+'\')">استلام</button><button class="ib" onclick="setO(\''+o.id+'\',\'waiting\')">انتظار</button><button class="ib purple" onclick="openEdit(\''+o.id+'\')">تعديل</button>'}
if(o.status==='accepted'){h+='<button class="ib purple" onclick="openEdit(\''+o.id+'\')">تعديل</button>'}
if(o.status==='assigned'||o.status==='waiting'){h+='<button class="ib green" onclick="deliverNow(\''+o.id+'\')">تم التسليم</button>'}
