<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Mer - Merchant Portal</title>
<meta name="theme-color" content="#0b1f3a">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--navy:#0b1f3a;--navy2:#123055;--gold:#c9a24b;--gold2:#e0be6e;--cy:#22d3ee;--gr:#10b981;--rd:#ef4444;--wa:#25d366;--bg:#081226;--txt:#eef2f8;--mut:#8a94a6;--line:rgba(201,162,75,.25);--card:rgba(255,255,255,.04)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal';background:radial-gradient(1200px 600px at 50% -20%,rgba(201,162,75,.06),transparent),var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px}

.header{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:16px 20px;border-bottom:2px solid var(--gold);display:flex;justify-content:space-between;align-items:center}
.header .brand{font-family:'Cairo';font-size:20px;font-weight:900;color:var(--gold2)}
.header .phone{color:var(--cy);font-size:13px;font-weight:700}
.header .logoutBtn{padding:8px 16px;border-radius:8px;border:1.5px solid var(--rd);background:transparent;color:var(--rd);font-family:'Tajawal';font-size:11px;font-weight:800;cursor:pointer}

.container{max-width:1200px;margin:0 auto;padding:20px}
.welcomeBox{background:linear-gradient(160deg,rgba(201,162,75,.12),rgba(11,31,58,.8));border:1.5px solid var(--gold);border-radius:16px;padding:24px;margin-bottom:24px;text-align:center}
.welcomeBox h2{font-family:'Cairo';font-size:22px;font-weight:900;color:var(--gold2);margin-bottom:6px}
.welcomeBox p{color:var(--mut);font-size:12px}

.statsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.statBox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.statBox .value{font-family:'Cairo';font-size:24px;font-weight:900;color:var(--gold2);margin-bottom:4px}
.statBox .label{font-size:11px;color:var(--mut);font-weight:700}

.contentGrid{display:grid;grid-template-columns:1fr 1.5fr;gap:16px}
.section{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px}
.sectionTitle{font-family:'Cairo';font-size:14px;font-weight:900;color:var(--gold2);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--line)}

.inputField{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(10,31,58,.8);color:var(--txt);font-size:13px;font-family:'Tajawal';margin-bottom:10px}
.inputField:focus{outline:none;border-color:var(--gold)}
.actionBtn{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-family:'Cairo';font-weight:900;font-size:13px;cursor:pointer;transition:.3s}
.actionBtn:hover{transform:translateY(-1px)}
.whatsAppBtn{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--wa),#128c7e);color:#fff;font-family:'Cairo';font-weight:900;font-size:13px;cursor:pointer;transition:.3s;margin-top:8px}
.whatsAppBtn:hover{transform:translateY(-1px)}

.ordersList{display:flex;flex-direction:column;gap:10px}
.orderCard{background:rgba(255,255,255,.03);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.orderCard .orderHeader{display:flex;justify-content:space-between;margin-bottom:10px}
.orderCard .code{font-family:'Cairo';font-weight:900;color:var(--gold2);font-size:14px}
.orderCard .status{font-size:10px;font-weight:800;padding:4px 12px;border-radius:20px}
.orderCard .status.new{background:rgba(251,191,36,.15);color:#fbbf24}
.orderCard .status.assigned{background:rgba(59,130,246,.15);color:#60a5fa}
.orderCard .status.delivered{background:rgba(34,211,238,.15);color:#22d3ee}
.orderCard .info{font-size:11px;color:var(--mut);line-height:1.8}
.orderCard .info strong{color:var(--txt)}

.authBox{max-width:420px;margin:80px auto;background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:30px}
.authBox h2{font-family:'Cairo';color:var(--gold2);text-align:center;margin-bottom:20px}
.authTabs{display:flex;gap:8px;margin-bottom:20px}
.authTab{flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--mut);font-family:'Cairo';font-weight:800;font-size:12px;cursor:pointer}
.authTab.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}

.socialLinks{background:rgba(37,211,102,.08);border:1.5px solid var(--wa);border-radius:12px;padding:14px;margin-top:16px}
.socialLinks h4{color:var(--wa);font-size:12px;margin-bottom:10px;font-family:'Cairo'}
.socialLinks a{display:block;color:var(--wa);font-size:12px;margin-bottom:6px;text-decoration:none;font-weight:700}
.socialLinks a:hover{text-decoration:underline}

.pendingBox{background:rgba(251,191,36,.1);border:1.5px solid #fbbf24;border-radius:12px;padding:20px;text-align:center;margin:40px auto;max-width:400px}
.pendingBox h3{color:#fbbf24;font-family:'Cairo';margin-bottom:10px}
.pendingBox p{color:var(--mut);font-size:12px}

.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold2);padding:12px 26px;border-radius:30px;border:1.5px solid var(--gold);font-weight:800;font-size:13px;z-index:200;opacity:0;transition:.4s}
.toast.show{opacity:1}

@media(max-width:1024px){.contentGrid{grid-template-columns:1fr}}
</style></head><body>

<div id="authScreen">
  <div class="authBox">
    <h2>بوابة التاجر</h2>
    <div class="authTabs">
      <button class="authTab active" onclick="switchAuth('login')">تسجيل دخول</button>
      <button class="authTab" onclick="switchAuth('register')">حساب جديد</button>
    </div>
    
    <div id="loginForm">
      <input class="inputField" id="loginPhone" placeholder="رقم الهاتف">
      <input class="inputField" id="loginPass" type="password" placeholder="كلمة المرور">
      <button class="actionBtn" onclick="doLogin()">دخول</button>
    </div>
    
    <div id="registerForm" style="display:none">
      <input class="inputField" id="regName" placeholder="اسم التاجر / المحل">
      <input class="inputField" id="regPhone" placeholder="رقم الهاتف">
      <input class="inputField" id="regPass" type="password" placeholder="كلمة المرور">
      <button class="actionBtn" onclick="doRegister()">إنشاء الحساب</button>
      <p style="color:var(--mut);font-size:11px;text-align:center;margin-top:12px">سيتم تفعيل حسابك من الإدارة</p>
    </div>
  </div>
</div>

<div id="pendingScreen" style="display:none">
  <div class="pendingBox">
    <h3>⏳ حسابك قيد التفعيل</h3>
    <p>تم إرسال طلبك للإدارة. سيتم تفعيل حسابك قريباً.</p>
    <button class="actionBtn" onclick="logout()" style="margin-top:16px">خروج</button>
  </div>
</div>

<div id="merchantApp" style="display:none">
  <div class="header">
    <div class="brand">Flash Mer - Merchant Portal</div>
    <div class="phone" id="displayPhone"></div>
    <button class="logoutBtn" onclick="logout()">خروج</button>
  </div>

  <div class="container">
    <div class="welcomeBox">
      <h2>مرحباً <span id="merchantName"></span></h2>
      <p>أضف طلباتك وتابع حالة التوصيل</p>
    </div>

    <div class="statsGrid">
      <div class="statBox"><div class="value" id="mStatNew">0</div><div class="label">طلبات جديدة</div></div>
      <div class="statBox"><div class="value" id="mStatProg">0</div><div class="label">قيد التوصيل</div></div>
      <div class="statBox"><div class="value" id="mStatDone">0</div><div class="label">مسلّمة</div></div>
    </div>

    <div class="contentGrid">
      <div class="section">
        <div class="sectionTitle">إضافة طلب جديد</div>
        <input class="inputField" id="pCode" placeholder="رقم الطلب (اختياري)">
        <input class="inputField" id="pArea" placeholder="المنطقة *">
        <input class="inputField" id="pAddr" placeholder="العنوان التفصيلي *">
        <input class="inputField" id="pAmount" placeholder="المبلغ *">
        <input class="inputField" id="pFee" placeholder="أجر التوصيل">
        <select class="inputField" id="pCur">
          <option value="syp">ليرة سورية</option>
          <option value="usd">دولار</option>
        </select>
        <input class="inputField" id="pNote" placeholder="ملاحظات">
        <button class="actionBtn" onclick="createOrder()">إرسال الطلب</button>
        <button class="whatsAppBtn" onclick="sendWhatsAppOrder()">📱 إرسال عبر واتساب</button>
        
        <div class="socialLinks" id="socialLinks" style="display:none">
          <h4>📱 تواصل مع الإدارة</h4>
          <div id="socialContent"></div>
        </div>
      </div>

      <div class="section">
        <div class="sectionTitle">طلباتي</div>
        <div class="ordersList" id="merchantOrders">
          <div style="color:var(--mut);text-align:center;padding:40px">جارٍ التحميل...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e",measurementId:"G-5L2R7Y2RQS"};
firebase.initializeApp(firebaseConfig);var FB=firebase.database();
function $(id){return document.getElementById(id)}
var ORDERS=[],currentMerchant=null,SOCIAL={};

function switchAuth(t){
  document.querySelectorAll('.authTab').forEach(function(e){e.classList.remove('active')});
  event.target.classList.add('active');
  $('loginForm').style.display=t==='login'?'block':'none';
  $('registerForm').style.display=t==='register'?'block':'none';
}

function doLogin(){
  var phone=$('loginPhone').value.trim(),pass=$('loginPass').value;
  if(!phone||!pass){showToast('أدخل البيانات');return}
  FB.ref('fm/merchants').orderByChild('phone').equalTo(phone).once('value').then(function(s){
    var found=null;
    s.forEach(function(c){var m=c.val();if(m.pass===pass){found={id:c.key,data:m}}});
    if(!found){showToast('بيانات خاطئة');return}
    if(!found.data.active){
      $('authScreen').style.display='none';$('pendingScreen').style.display='block';
      currentMerchant=found;return;
    }
    currentMerchant=found;
    $('authScreen').style.display='none';$('merchantApp').style.display='block';
    $('displayPhone').textContent=phone;$('merchantName').textContent=found.data.name;
    loadOrders();loadSocial();
    showToast('مرحباً '+found.data.name);
  });
}

function doRegister(){
  var name=$('regName').value.trim(),phone=$('regPhone').value.trim(),pass=$('regPass').value;
  if(!name||!phone||!pass){showToast('جميع الحقول مطلوبة');return}
  FB.ref('fm/merchants').push({name:name,phone:phone,pass:pass,active:false,ts:Date.now()});
  showToast('تم إنشاء الحساب - بانتظار التفعيل');
  $('regName').value='';$('regPhone').value='';$('regPass').value='';
}

function logout(){
  currentMerchant=null;
  $('merchantApp').style.display='none';$('pendingScreen').style.display='none';$('authScreen').style.display='block';
}

function loadOrders(){
  FB.ref('fm/orders').orderByChild('phone').equalTo(currentMerchant.data.phone).on('value',function(s){
    ORDERS=[];s.forEach(function(c){var o=c.val();o.id=c.key;ORDERS.push(o)});
    renderOrders();updateStats();
  });
}

function loadSocial(){
  FB.ref('fm/social').once('value').then(function(s){
    SOCIAL=s.val()||{};
    var html='';
    if(SOCIAL.whatsapp)html+='<a href="https://wa.me/'+SOCIAL.whatsapp+'" target="_blank">📱 واتساب: '+SOCIAL.whatsapp+'</a>';
    if(SOCIAL.facebook)html+='<a href="'+SOCIAL.facebook+'" target="_blank">📘 فيسبوك</a>';
    if(SOCIAL.instagram)html+='<a href="'+SOCIAL.instagram+'" target="_blank">📷 انستغرام</a>';
    if(html){$('socialLinks').style.display='block';$('socialContent').innerHTML=html}
  });
}

function fmt(v,c){return c==='syp'?Number(v||0).toLocaleString('en-US')+' ل.س':'$'+Number(v||0).toLocaleString('en-US')}
function today(){return new Date().toISOString().slice(0,10)}

function updateStats(){
  $('mStatNew').textContent=ORDERS.filter(function(o){return o.status==='new'}).length;
  $('mStatProg').textContent=ORDERS.filter(function(o){return o.status==='assigned'||o.status==='waiting'||o.status==='accepted'}).length;
  $('mStatDone').textContent=ORDERS.filter(function(o){return o.status==='delivered'}).length;
}

function createOrder(){
  var code=$('pCode').value.trim()||('FM'+Date.now().toString().slice(-6));
  var area=$('pArea').value.trim(),addr=$('pAddr').value.trim();
  var amount=parseFloat($('pAmount').value)||0,fee=parseFloat($('pFee').value)||0,cur=$('pCur').value,note=$('pNote').value.trim();
  if(!area||!addr||!amount){showToast('البيانات الإجبارية ناقصة');return}
  FB.ref('fm/orders').push({code:code,phone:currentMerchant.data.phone,area:area,addr:addr,amount:amount,cur:cur,fee:fee,feeCur:cur,type:'merchant',note:note,status:'new',driver:'',collected:0,ts:Date.now(),day:today()});
  showToast('تم إرسال '+code);
  $('pCode').value='';$('pArea').value='';$('pAddr').value='';$('pAmount').value='';$('pFee').value='';$('pNote').value='';
}

function sendWhatsAppOrder(){
  var area=$('pArea').value.trim(),addr=$('pAddr').value.trim();
  var amount=parseFloat($('pAmount').value)||0,fee=parseFloat($('pFee').value)||0,cur=$('pCur').value,note=$('pNote').value.trim();
  if(!area||!addr||!amount){showToast('البيانات الإجبارية ناقصة');return}
  
  var msg='⚡ *Flash Mer - طلب جديد من التاجر*\n\n';
  msg+='📋 *رقم الطلب:* '+($('pCode').value.trim()||'جديد')+'\n';
  msg+='📍 *المنطقة:* '+area+'\n';
  msg+='🏠 *العنوان:* '+addr+'\n';
  msg+='💵 *المبلغ:* '+fmt(amount,cur)+'\n';
  if(fee)msg+=' *أجر التوصيل:* '+fmt(fee,cur)+'\n';
  if(note)msg+='📝 *ملاحظات:* '+note+'\n';
  msg+='\n هاتف التاجر: '+currentMerchant.data.phone;
  
  if(SOCIAL.whatsapp){
    var clean=SOCIAL.whatsapp.replace(/^0/,'').replace(/^963/,'963').replace(/[\s\+\-]/g,'');
    if(!clean.startsWith('963'))clean='963'+clean;
    var url='https://wa.me/'+clean+'?text='+encodeURIComponent(msg);
    window.open(url,'_blank');
  }else{
    showToast('⚠️ رقم واتساب الإدارة غير متوفر');
  }
}

function renderOrders(){
  $('merchantOrders').innerHTML=ORDERS.sort(function(a,b){return (b.ts||0)-(a.ts||0)}).map(function(o){
    var st=o.status==='new'?'new':o.status==='assigned'?'assigned':'delivered';
    var stT=o.status==='new'?'جديد':o.status==='assigned'?'مسند للسائق':'تم التسليم';
    return '<div class="orderCard"><div class="orderHeader"><div class="code">'+(o.code||'—')+'</div><div class="status '+st+'">'+stT+'</div></div>'+
      '<div class="info"><div>المنطقة: '+o.area+'</div><div>العنوان: '+o.addr+'</div>'+
      '<div>المبلغ: <strong>'+fmt(o.amount,o.cur)+'</strong></div>'+
      (o.fee?'<div>أجر التوصيل: '+fmt(o.fee,o.feeCur||o.cur)+'</div>':'')+
      '<div>التاريخ: '+new Date(o.ts).toLocaleString('ar-SY')+'</div></div></div>';
  }).join('')||'<div style="color:var(--mut);text-align:center;padding:40px">لا توجد طلبات</div>';
}

function showToast(m){var t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2800)}
</script></body></html>
