<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انضم كتاجر — المفتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Tajawal';min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(700px 340px at 50% -10%,rgba(201,162,75,.15),transparent),#0b1f3a;padding:20px}
.box{width:100%;max-width:430px;background:#fff;border-radius:20px;padding:26px;border-top:4px solid #c9a24b;box-shadow:0 30px 60px rgba(11,31,58,.35)}
h1{font-family:'Cairo';color:#0b1f3a;font-size:20px;text-align:center}
p{color:#8a94a6;font-size:12px;text-align:center;margin:4px 0 18px}
.in{width:100%;padding:13px;border:1.5px solid #e8e4da;border-radius:11px;font-size:14px;margin-bottom:10px;font-family:'Tajawal';background:#fdfcf9}
.in:focus{outline:none;border-color:#c9a24b}
.btn{width:100%;padding:14px;border:none;border-radius:11px;background:linear-gradient(135deg,#c9a24b,#e0be6e);color:#0b1f3a;font-weight:800;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.97)}
.ok{display:none;background:#e5f5ee;border:1px solid #1e8e5a;color:#1e8e5a;border-radius:12px;padding:16px;text-align:center;font-weight:800;line-height:1.8}
</style></head><body>
<div class="box">
<h1>🏬 انضم كتاجر لشركة المفتي</h1>
<p>عبّي البيانات — رح توصل للإدارة فوراً ويوصلك واتساب عند التفعيل</p>
<form id="f" onsubmit="return submitJoin(event)">
<input class="in" id="jName" placeholder="اسم المحل / التاجر *" required>
<input class="in" id="jPhone" type="tel" placeholder="رقم واتساب *" required>
<select class="in" id="jCat" required>
<option value="">— مجال المحل —</option>
<option>ملابس</option><option>أحذية</option><option>عطورات</option><option>إكسسوارات</option><option>أجهزة وموبايل</option><option>مواد غذائية</option><option>أخرى</option>
</select>
<input class="in" id="jUser" placeholder="اسم مستخدم للدخول *" required>
<input class="in" id="jPass" type="password" placeholder="كلمة مرور *" required>
<textarea class="in" id="jNote" placeholder="ملاحظات (اختياري)"></textarea>
<button class="btn" type="submit">إرسال الطلب</button>
</form>
<div class="ok" id="ok">✔ تم إرسال طلبك بنجاح!<br>رح تصلك رسالة واتساب من الإدارة عند التفعيل.</div>
</div>
<script>
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e",measurementId:"G-5L2R7Y2RQS"};
firebase.initializeApp(firebaseConfig);var FB=firebase.database();
function submitJoin(e){e.preventDefault();
var u=$('#jUser').value.trim();
FB.ref('mufti/users/'+u).once('value').then(function(s){
if(s.exists()){alert('❌ اسم المستخدم موجود قبل — اختر غيره');return}
FB.ref('mufti/users/'+u).set({
name:$('#jName').value.trim(),phone:$('#jPhone').value.trim(),category:$('#jCat').value,
pass:$('#jPass').value,role:'merchant',active:false,note:$('#jNote').value,ts:Date.now()
}).then(function(){$('#f').style.display='none';$('#ok').style.display='block'})
})
return false}
function $(s){return document.querySelector(s)}
</script></body></html>
