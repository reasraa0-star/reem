<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بريد عمر المؤقت | استقبل أكوادك</title>
<link rel="manifest" href="mail-manifest.json">
<meta name="theme-color" content="#0b1e33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=Tajawal:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1e33;--bg2:#0f2740;--card:#12294a;--card2:#16305a;--txt:#eaf2ff;--mut:#8fa3c0;--amber:#ffb703;--teal:#06d6a0;--red:#ef476f;--mono:'IBM Plex Mono',monospace;--disp:'Changa',sans-serif;--body:'Tajawal',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--body);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(700px 340px at 85% -60px,rgba(255,183,3,.08),transparent),radial-gradient(600px 320px at -60px 100%,rgba(6,214,160,.07),transparent);pointer-events:none}
.env{position:fixed;font-size:34px;opacity:.07;animation:fl 16s ease-in-out infinite;pointer-events:none}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-30px) rotate(8deg)}}
header{position:sticky;top:0;z-index:100;background:rgba(11,30,51,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,183,3,.15)}
.hin{max-width:1000px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
.hin .lg{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--amber),#fb8500);display:grid;place-items:center;font-size:20px;box-shadow:0 8px 20px rgba(255,183,3,.3)}
.hin b{font-family:var(--disp);font-size:18px}
.hin small{display:block;color:var(--mut);font-size:10.5px}
.hin .sp{margin-right:auto;display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--txt);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.hbtn:hover{background:var(--amber);color:var(--bg)}
.wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
.ticket{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid rgba(255,183,3,.25);border-radius:20px;padding:26px 22px;margin-bottom:18px;box-shadow:0 20px 50px rgba(0,0,0,.35);transition:.3s}
.ticket:hover{transform:translateY(-3px)}
.ticket::before,.ticket::after{content:'';position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--bg);transform:translateY(-50%);border:1px solid rgba(255,183,3,.25)}
.ticket::before{right:-14px}.ticket::after{left:-14px}
.ticket .stamp{position:absolute;top:14px;left:14px;width:56px;height:64px;border:2px dashed rgba(255,183,3,.5);border-radius:6px;display:grid;place-items:center;font-size:24px;transform:rotate(6deg);color:var(--amber);background:rgba(255,183,3,.06)}
.ticket .lbl{color:var(--amber);font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.addr{font-family:var(--mono);font-size:clamp(16px,4.4vw,25px);font-weight:700;direction:ltr;text-align:left;color:#fff;word-break:break-all;margin-bottom:16px;text-shadow:0 0 24px rgba(255,183,3,.25)}
.tacts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:11px;font-weight:700;font-size:13px;padding:11px 18px;cursor:pointer;transition:.2s;font-family:var(--body)}
.btn:active{transform:scale(.96)}
.b1{background:linear-gradient(135deg,var(--amber),#fb8500);color:var(--bg)}.b1:hover{transform:translateY(-2px)}
.b2{background:rgba(6,214,160,.14);color:var(--teal);border:1px solid rgba(6,214,160,.3)}.b2:hover{background:var(--teal);color:var(--bg)}
.b3{background:rgba(255,255,255,.07);color:var(--txt);border:1px solid rgba(255,255,255,.12)}.b3:hover{border-color:var(--amber)}
.create{display:none;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;margin-bottom:18px}
.create.on{display:block}
.create .row{display:flex;gap:8px;flex-wrap:wrap}
.create input{flex:1;min-width:150px;padding:11px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.12);background:var(--bg2);color:var(--txt);font-size:14px;direction:ltr;text-align:left;font-family:var(--mono)}
.create input:focus{outline:none;border-color:var(--amber)}
.accs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.acc{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:30px;padding:7px 14px;font-family:var(--mono);font-size:11.5px;direction:ltr;cursor:pointer;transition:.2s}
.acc.on{border-color:var(--teal);background:rgba(6,214,160,.1);color:var(--teal)}
.acc .x{color:var(--red);font-weight:700;border:none;background:none;cursor:pointer;font-size:12px}
.inhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.radar{width:46px;height:46px;border-radius:50%;position:relative;background:radial-gradient(circle,rgba(6,214,160,.18),transparent 70%);flex-shrink:0}
.radar::before{content:'';position:absolute;inset:6px;border:1px solid rgba(6,214,160,.4);border-radius:50%}
.radar::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(6,214,160,.7),transparent 40%);animation:sweep 2.4s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
.inhead h2{font-family:var(--disp);font-size:19px}
.inhead .last{color:var(--mut);font-size:11px}
.inhead .live{margin-right:auto;display:flex;align-items:center;gap:6px;color:var(--teal);font-size:11px;font-weight:700}
.inhead .live i{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:bk 1.2s infinite}
@keyframes bk{50%{opacity:.2}}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{background:var(--card);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.25s;animation:fin .4s both}
.msg:hover{transform:translateX(-4px);border-color:var(--amber)}
@keyframes fin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.msg .ic{width:42px;height:42px;border-radius:11px;background:rgba(255,183,3,.12);display:grid;place-items:center;font-size:19px;flex-shrink:0}
.msg.fresh .ic{background:rgba(6,214,160,.15);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.msg .mm{flex:1;min-width:0}
.msg .mm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .mm small{color:var(--mut);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .code{background:rgba(6,214,160,.14);color:var(--teal);border:1px dashed rgba(6,214,160,.4);border-radius:8px;padding:5px 10px;font-family:var(--mono);font-weight:700;font-size:14px;direction:ltr}
.msg .nw{background:var(--red);color:#fff;font-size:9.5px;border-radius:12px;padding:3px 8px;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:44px 20px;background:var(--card);border:1px dashed rgba(255,255,255,.12);border-radius:16px}
.empty .e{font-size:46px;margin-bottom:10px;animation:bob 2.4s ease-in-out infinite;display:inline-block}
.modal{display:none;position:fixed;inset:0;background:rgba(4,12,22,.8);backdrop-filter:blur(5px);z-index:300;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--card);border:1px solid rgba(255,183,3,.25);border-radius:20px;width:100%;max-width:560px;max-height:86vh;overflow-y:auto;padding:24px;position:relative;animation:fin .3s}
.mbox .cls{position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--txt);cursor:pointer;font-size:15px}
.mbox .frm{color:var(--mut);font-size:11.5px;direction:ltr;text-align:left}
.mbox h3{font-family:var(--disp);font-size:17px;margin:6px 0 12px}
.codebox{background:rgba(6,214,160,.1);border:1px dashed rgba(6,214,160,.5);border-radius:14px;padding:16px;text-align:center;margin-bottom:14px;cursor:pointer}
.codebox .c{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--teal);letter-spacing:6px;direction:ltr}
.codebox small{color:var(--mut);font-size:11px}
.mbody{background:var(--bg2);border-radius:12px;padding:14px;font-size:13px;line-height:1.9;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto}
.mbody iframe{width:100%;height:300px;border:none;background:#fff;border-radius:8px}
footer{background:var(--bg2);border-top:1px solid rgba(255,183,3,.15);padding:26px 18px;text-align:center;color:var(--mut);font-size:12px}
footer .dev{color:var(--amber);font-family:var(--disp);font-weight:700;font-size:14px;margin-bottom:4px}
footer .ph{font-family:var(--mono);color:var(--teal)}
.toast{position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-24px);background:var(--card2);border:1px solid rgba(6,214,160,.4);color:var(--teal);padding:12px 24px;border-radius:50px;font-weight:700;font-size:13px;z-index:400;opacity:0;transition:.4s;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<span class="env" style="top:14%;left:6%">✉️</span><span class="env" style="top:60%;right:5%;animation-delay:-5s">📨</span><span class="env" style="top:82%;left:10%;animation-delay:-9s">📬</span>

<header><div class="hin">
  <span class="lg">📬</span>
  <span><b>بريد عمر المؤقت</b><small>أنشئ إيميلاً واستقبل الأكواد فوراً</small></span>
  <span class="sp">
    <button class="hbtn" id="instB" style="display:none" onclick="installApp()">📲 تثبيت</button>
    <button class="hbtn" onclick="createAccount()">✨ إيميل جديد</button>
  </span>
</div></header>

<div class="wrap">
  <div class="ticket">
    <div class="stamp">✉</div>
    <div class="lbl">عنوان بريدك الإلكتروني المؤقت</div>
    <div class="addr" id="addr">… جاري الإنشاء …</div>
    <div class="tacts">
      <button class="btn b1" onclick="copyAddr()">📋 نسخ العنوان</button>
      <button class="btn b2" onclick="toggleCreate()">⚙️ تخصيص عنوان</button>
      <button class="btn b3" onclick="poll()">🔄 تحديث</button>
    </div>
  </div>

  <div class="create" id="createP">
    <div class="row">
      <input id="cuName" placeholder="username (أحرف إنجليزية وأرقام)">
      <button class="btn b1" onclick="createCustom()">➕ إنشاء بهذا الاسم</button>
    </div>
  </div>

  <div class="accs" id="accs"></div>

  <div class="inhead">
    <div class="radar"></div>
    <div><h2>صندوق الوارد</h2><div class="last" id="lastChk">بانتظار الرسائل…</div></div>
    <span class="live"><i></i> مراقبة حية</span>
  </div>
  <div class="msgs" id="msgs"></div>
</div>

<footer>
  <div class="dev">تطوير وبرمجة: عمر الرفاعي</div>
  <div>جميع الحقوق محفوظة © 2026 — بريد عمر المؤقت</div>
  <div style="margin-top:6px">للتواصل: <span class="ph" dir="ltr">0994451442</span></div>
</footer>

<div class="modal" id="reader"><div class="mbox">
  <button class="cls" onclick="closeReader()">✕</button>
  <div class="frm" id="rFrom"></div>
  <h3 id="rSub"></h3>
  <div class="codebox" id="rCodeBox" style="display:none" onclick="copyTxt(document.getElementById('rCode').textContent)"><small>🔑 الكود المستخرج — اضغط للنسخ</small><div class="c" id="rCode"></div></div>
  <div class="mbody" id="rBody"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
var HOSTS=['https://api.mail.tm','https://api.mail.gw'];
var H=HOSTS[0];
var ACCS=LS('mt_accs',[]),CUR=null,DOMS=[],lastList=[],FRESH=LS('mt_fresh',{});
function LS(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function SV(k,v){localStorage.setItem(k,JSON.stringify(v))}
function $(s){return document.querySelector(s)}
var _t;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(_t);_t=setTimeout(function(){t.classList.remove('on')},2600)}

/* ===== API ===== */
function reqAt(host,path,opts){opts=opts||{};opts.headers=opts.headers||{};opts.headers['Content-Type']='application/json';if(CUR&&CUR.token&&!opts.noAuth)opts.headers['Authorization']='Bearer '+CUR.token;
  return fetch(host+path,opts).then(function(r){if(!r.ok){var e=new Error('http'+r.status);e.status=r.status;throw e}return r.json().catch(function(){return{}})})}
function api(path,opts){return reqAt(H,path,opts).catch(function(e){var o=HOSTS.filter(function(h){return h!==H})[0];if(!o)throw e;H=o;return reqAt(H,path,opts)})}

/* ===== domains & accounts ===== */
function loadDomains(){return api('/domains',{noAuth:true}).then(function(d){DOMS=(d['hydra:member']||[]).map(function(x){return x.domain});if(!DOMS.length)throw 0;return DOMS})}
function makeLocal(){var s='',c='abcdefghijklmnopqrstuvwxyz0123456789';for(var i=0;i<10;i++)s+=c[Math.floor(Math.random()*c.length)];return 'omar-'+s}
function makePass(){var s='',c='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';for(var i=0;i<14;i++)s+=c[Math.floor(Math.random()*c.length)];return s+'A1'}
function createAccount(local){
  loadDomains().then(function(){
    var l=local||makeLocal();var d=DOMS[Math.floor(Math.random()*DOMS.length)];
    var addr=l+'@'+d,pass=makePass();
    return api('/accounts',{method:'POST',noAuth:true,body:JSON.stringify({address:addr,password:pass})}).then(function(){
      return api('/token',{method:'POST',noAuth:true,body:JSON.stringify({address:addr,password:pass})}).then(function(t){
        var acc={address:addr,password:pass,token:t.token||''};
        var ex=ACCS.filter(function(a){return a.address===addr})[0];
        if(!ex){ACCS.push(acc);SV('mt_accs',ACCS)}else{ex.token=acc.token;SV('mt_accs',ACCS)}
        CUR=acc;SV('mt_cur',addr);render();poll();toast('✅ أُنشئ العنوان: '+addr);
      })
    })
  }).catch(function(e){toast('❌ تعذّر الإنشاء — تحقق من الإنترنت أو جرّب اسماً آخر');console.error(e)})}
function createCustom(){var n=$('#cuName').value.trim().toLowerCase();if(!/^[a-z0-9._-]{3,}$/.test(n)){toast('⚠️ اسم غير صالح');return}createAccount(n)}
function setCur(addr){CUR=ACCS.filter(function(a){return a.address===addr})[0]||null;SV('mt_cur',addr);render();poll()}
function delAcc(addr,ev){ev.stopPropagation();ACCS=ACCS.filter(function(a){return a.address!==addr});SV('mt_accs',ACCS);
  if(CUR&&CUR.address===addr){CUR=ACCS[0]||null;SV('mt_cur',CUR?CUR.address:null)}
  if(!CUR&&ACCS.length)setCur(ACCS[0].address);render();poll()}
function render(){$('#addr').textContent=CUR?CUR.address:'—';
  $('#accs').innerHTML=ACCS.map(function(a){return '<span class="acc'+(CUR&&a.address===CUR.address?' on':'')+'" onclick="setCur(\''+a.address+'\')">'+a.address+'<button class="x" onclick="delAcc(\''+a.address+'\',event)">✕</button></span>'}).join('')}
function copyAddr(){if(CUR)copyTxt(CUR.address)}
function copyTxt(t){if(navigator.clipboard)navigator.clipboard.writeText(t);else{var i=document.createElement('textarea');i.value=t;document.body.appendChild(i);i.select();document.execCommand('copy');i.remove()}toast('📋 تم النسخ')}
function toggleCreate(){$('#createP').classList.toggle('on')}

/* ===== inbox ===== */
function refreshToken(){return api('/token',{method:'POST',noAuth:true,body:JSON.stringify({address:CUR.address,password:CUR.password})}).then(function(t){CUR.token=t.token;var a=ACCS.filter(function(x){return x.address===CUR.address})[0];if(a)a.token=CUR.token;SV('mt_accs',ACCS)})}
function poll(){if(!CUR){$('#msgs').innerHTML='<div class="empty"><span class="e">📭</span><br>أنشئ عنواناً أولاً</div>';return}
  api('/messages').then(function(d){lastList=d['hydra:member']||[];detectNew();renderInbox();$('#lastChk').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-SY')})
  .catch(function(e){if(e&&e.status===401){refreshToken().then(poll).catch(function(){fail()})}else fail()});
  function fail(){$('#lastChk').innerHTML='⚠️ تعذّر الاتصال — سيُعاد تلقائياً'}}
function detectNew(){var key=CUR.address;var seen=LS('om_seen_'+key,[]);var fresh=[];
  lastList.forEach(function(m){if(seen.indexOf(m.id)<0)fresh.push(m.id)});
  if(fresh.length){SV('om_seen_'+key,seen.concat(fresh));if(!FRESH[key])FRESH[key]=[];fresh.forEach(function(id){if(FRESH[key].indexOf(id)<0)FRESH[key].push(id)});SV('mt_fresh',FRESH);
    toast('📨 وصلت '+fresh.length+' رسالة جديدة!');if(navigator.vibrate)navigator.vibrate([120,60,120])}}
function renderInbox(){var key=CUR?CUR.address:'';var fr=FRESH[key]||[];
  if(!lastList.length){$('#msgs').innerHTML='<div class="empty"><span class="e">📭</span><br>لا رسائل بعد…<br><small>انسخ عنوانك واستخدمه في أي تسجيل، والرسائل تصل هنا تلقائياً</small></div>';return}
  $('#msgs').innerHTML=lastList.map(function(m,i){var code=extractCode(m.subject);var isF=fr.indexOf(m.id)>=0;var from=m.from&&m.from.address?m.from.address:'';var dt=(m.createdAt||'').replace('T',' ').slice(0,16);
    return '<div class="msg'+(isF?' fresh':'')+'" style="animation-delay:'+(i*0.05)+'s" onclick="openMsg(\''+m.id+'\')"><div class="ic">'+(isF?'📨':'️')+'</div><div class="mm"><b>'+esc(m.subject||'(بدون عنوان)')+'</b><small>'+esc(from)+' — '+dt+'</small></div>'+(code?'<span class="code">'+code+'</span>':'')+(isF?'<span class="nw">جديد</span>':'')+'</div>'}).join('')}
function esc(s){return String(s).replace(/</g,'&lt;')}

/* ===== code & reader ===== */
function extractCode(s){if(!s)return null;var m=String(s).match(/(?:code|كود|رمز|verification|otp|confirm)[^\d]{0,14}(\d{4,8})/i);if(m)return m[1];var a=String(s).match(/\b\d{4,8}\b/g);return a?a[0]:null}
function stripHtml(h){var d=document.createElement('div');d.innerHTML=h;return d.textContent||''}
function openMsg(id){api('/messages/'+id).then(function(m){
  $('#rFrom').textContent=(m.from&&m.from.address)||'';$('#rSub').textContent=m.subject||'(بدون عنوان)';
  var html=m.html?(Array.isArray(m.html)?m.html.join(''):m.html):'';var text=m.text||'';
  var code=extractCode((m.subject||'')+' '+text+' '+stripHtml(html));
  if(code){$('#rCodeBox').style.display='block';$('#rCode').textContent=code}else{$('#rCodeBox').style.display='none'}
  var body=$('#rBody');
  if(html){body.innerHTML='<iframe sandbox srcdoc="'+html.replace(/"/g,'&quot;')+'"></iframe>'}
  else{body.textContent=text||'(لا محتوى)'}
  $('#reader').classList.add('on')}).catch(function(){toast('❌ تعذّر فتح الرسالة')})}
function closeReader(){$('#reader').classList.remove('on')}

/* ===== pwa ===== */
var defP=null;addEventListener('beforeinstallprompt',function(e){e.preventDefault();defP=e;$('#instB').style.display='inline-block'});
function installApp(){if(defP)defP.prompt();else toast('ℹ️ من ⋮ في المتصفح ← تثبيت التطبيق')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('mail-sw.js').catch(function(){});

/* ===== boot ===== */
var curAddr=LS('mt_cur',null);
if(ACCS.length){CUR=ACCS.filter(function(a){return a.address===curAddr})[0]||ACCS[0];render();poll()}
else createAccount();
setInterval(poll,7000);
</script>
</body>
</html>
