<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Mer - تطبيق السائق</title>
<meta name="theme-color" content="#0b1f3a">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<style>
:root{--navy:#0b1f3a;--navy2:#123055;--navy3:#1a3a6e;--gold:#c9a24b;--gold2:#e0be6e;--cy:#22d3ee;--gr:#10b981;--rd:#ef4444;--or:#f97316;--purple:#8b5cf6;--bg:#081226;--txt:#eef2f8;--mut:#8a94a6;--line:rgba(201,162,75,.25);--card:rgba(255,255,255,.04)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal';background:radial-gradient(1200px 600px at 50% -20%,rgba(201,162,75,.06),transparent),var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px}

/* ===== Login ===== */
#loginScreen{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy),var(--navy2) 50%,var(--navy3));z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{background:var(--bg);border:2px solid var(--gold);border-radius:24px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.loginBox h1{font-family:'Cairo';font-size:28px;font-weight:900;color:var(--gold2);text-align:center;margin-bottom:8px}
.loginBox .subtitle{color:var(--mut);text-align:center;font-size:12px;margin-bottom:32px}
.inputGroup{margin-bottom:16px}
.inputGroup label{display:block;color:var(--gold2);font-size:11px;font-weight:800;margin-bottom:6px}
.inputGroup input{width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:rgba(10,31,58,.8);color:var(--txt);font-size:14px}
.inputGroup input:focus{outline:none;border-color:var(--gold)}
.loginBtn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-family:'Cairo';font-weight:900;font-size:15px;cursor:pointer}
.errorMsg{color:var(--rd);text-align:center;font-size:11px;margin-top:12px;font-weight:700;display:none}

/* ===== Header ===== */
.header{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:16px 20px;border-bottom:2px solid var(--gold);display:flex;justify-content:space-between;align-items:center}
.header .brand{font-family:'Cairo';font-size:20px;font-weight:900;color:var(--gold2)}
.header .userInfo{display:flex;align-items:center;gap:12px}
.header .driverName{color:var(--cy);font-size:13px;font-weight:700}
.header .logoutBtn{padding:8px 16px;border-radius:8px;border:1.5px solid var(--rd);background:transparent;color:var(--rd);font-family:'Tajawal';font-size:11px;font-weight:800;cursor:pointer}

.container{max-width:900px;margin:0 auto;padding:20px}

/* ===== Welcome ===== */
.welcomeBox{background:linear-gradient(160deg,rgba(201,162,75,.12),rgba(11,31,58,.8));border:1.5px solid var(--gold);border-radius:16px;padding:24px;margin-bottom:24px;text-align:center}
.welcomeBox h2{font-family:'Cairo';font-size:22px;font-weight:900;color:var(--gold2);margin-bottom:6px}
.welcomeBox p{color:var(--mut);font-size:12px}

/* ===== Stats ===== */
.statsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.statBox{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.statBox .value{font-family:'Cairo';font-size:24px;font-weight:900;color:var(--gold2);margin-bottom:4px}
.statBox .label{font-size:11px;color:var(--mut);font-weight:700}

/* ===== Tabs ===== */
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 18px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--mut);font-family:'Cairo';font-weight:800;font-size:12px;cursor:pointer}
.tab.active{background:var(--gold);color:var(--navy);border-color:var(--gold)}

/* ===== Section ===== */
.section{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
.sectionTitle{font-family:'Cairo';font-size:16px;font-weight:900;color:var(--gold2);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--line)}

/* ===== Order Card ===== */
.ordersList{display:flex;flex-direction:column;gap:12px}
.orderCard{background:rgba(0,0,0,.3);border:1.5px solid var(--line);border-radius:12px;padding:16px;transition:.3s}
.orderCard:hover{border-color:var(--gold)}
.orderTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.orderCode{font-family:'Cairo';font-size:18px;font-weight:900;color:var(--gold2)}
.orderStatus{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:800}
.status-assigned{background:rgba(59,130,246,.2);color:#60a5fa}
.status-waiting{background:rgba(249,115,22,.2);color:#f97316}
.status-postponed{background:rgba(139,92,246,.2);color:#8b5cf6}
.status-suspended{background:rgba(239,68,68,.2);color:#ef4444}
.status-delivered{background:rgba(16,185,129,.2);color:#10b981}

.orderInfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.infoRow{font-size:13px;color:var(--mut)}
.infoRow strong{color:var(--txt);font-weight:800}

.orderActions{display:flex;gap:8px;flex-wrap:wrap}
.orderActions button{flex:1;min-width:100px;padding:10px 14px;border-radius:8px;border:none;font-family:'Cairo';font-size:12px;font-weight:800;cursor:pointer;transition:.3s}
.orderActions button:hover{transform:translateY(-2px)}
.btnPickup{background:var(--gr);color:#fff}
.btnWait{background:var(--or);color:#fff}
.btnPostpone{background:var(--purple);color:#fff}
.btnSuspend{background:var(--rd);color:#fff}
.btnDeliver{background:var(--cy);color:var(--navy)}
.btnCall{background:rgba(37,211,102,.15);color:#25d366;border:1px solid rgba(37,211,102,.3)}

/* ===== Modal ===== */
.modal{display:none;position:fixed;inset:0;background:rgba(4,10,22,.92);z-index:90;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modalContent{background:linear-gradient(170deg,var(--navy2),var(--navy));border:2px solid var(--gold);border-radius:20px;padding:24px;width:100%;max-width:500px}
.modalHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modalTitle{font-family:'Cairo';font-size:18px;font-weight:900;color:var(--gold2)}
.closeBtn{background:none;border:none;color:var(--mut);font-size:24px;cursor:pointer}

.inputField{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:rgba(10,31,58,.8);color:var(--txt);font-size:13px;margin-bottom:10px}
.inputField:focus{outline:none;border-color:var(--gold)}
.actionBtn{width:100%;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-family:'Cairo';font-weight:900;font-size:13px;cursor:pointer;margin-top:10px}

/* ===== Toast ===== */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--gold2);padding:12px 26px;border-radius:30px;border:1.5px solid var(--gold);font-weight:800;font-size:13px;z-index:200;opacity:0;transition:.4s}
.toast.show{opacity:1}

@media(max-width:768px){
  .statsGrid{grid-template-columns:repeat(2,1fr)}
  .orderInfo{grid-template-columns:1fr}
  .orderActions button{min-width:80px}
}
</style></head><body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="loginBox">
    <h1>Flash Mer</h1>
    <div class="subtitle">تطبيق السائق</div>
    <div class="inputGroup"><label>اسم المستخدم</label><input type="text" id="loginUser" placeholder="أدخل اسم المستخدم"></div>
    <div class="inputGroup"><label>كلمة المرور</label><input type="password" id="loginPass" placeholder="أدخل كلمة المرور"></div>
    <button class="loginBtn" onclick="doLogin()">دخول</button>
    <div class="errorMsg" id="loginError">بيانات الدخول غير صحيحة</div>
  </div>
</div>

<!-- Main App -->
<div id="driverApp" style="display:none">
  <div class="header">
    <div class="brand">Flash Mer - السائق</div>
    <div class="userInfo">
      <span class="driverName" id="displayName">—</span>
      <button class="logoutBtn" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="container">
    <div class="welcomeBox">
      <h2>مرحباً <span id="driverName">—</span></h2>
      <p>طلباتك المسندة إليك - اختر الإجراء المناسب لكل طلب</p>
    </div>

    <!-- Stats -->
    <div class="statsGrid">
      <div class="statBox"><div class="value" id="statAssigned">0</div><div class="label">مسندة</div></div>
      <div class="statBox"><div class="value" id="statWaiting">0</div><div class="label">قيد الانتظار</div></div>
      <div class="statBox"><div class="value" id="statPostponed">0</div><div class="label">مؤجلة</div></div>
      <div class="statBox"><div class="value" id="statDelivered">0</div><div class="label">مسلّمة</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('active',this)">الطلبات النشطة</button>
      <button class="tab" onclick="switchTab('history',this)">السجل</button>
    </div>

    <!-- Active Orders -->
    <div id="tab-active" class="tab-content">
      <div class="section">
        <div class="sectionTitle">الطلبات المسندة إليك</div>
        <div class="ordersList" id="activeOrders">
          <div style="color:var(--mut);text-align:center;padding:40px">جارٍ التحميل...</div>
        </div>
      </div>
    </div>

    <!-- History -->
    <div id="tab-history" class="tab-content" style="display:none">
      <div class="section">
        <div class="sectionTitle">سجل الطلبات المسلّمة</div>
        <div class="ordersList" id="historyOrders">
          <div style="color:var(--mut);text-align:center;padding:40px">لا يوجد سجل</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Note Modal -->
<div class="modal" id="noteModal">
  <div class="modalContent">
    <div class="modalHeader">
      <div class="modalTitle" id="noteTitle">ملاحظة</div>
      <button class="closeBtn" onclick="closeModal()">&times;</button>
    </div>
    <input type="hidden" id="noteOrderId">
    <input type="hidden" id="noteAction">
    <div class="inputGroup">
      <label id="noteLabel">أضف ملاحظة (اختياري)</label>
      <textarea class="inputField" id="noteText" rows="3" placeholder="اكتب ملاحظة..."></textarea>
    </div>
    <div id="collectedGroup" style="display:none">
      <div class="inputGroup">
        <label>المبلغ المستلم</label>
        <input type="number" class="inputField" id="collectedAmount" placeholder="0">
      </div>
    </div>
    <button class="actionBtn" onclick="confirmAction()">تأكيد</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var firebaseConfig={apiKey:"AIzaSyAnO8p8p3xaPuBzEj239ncIhnV066zLhJQ",authDomain:"omar-28e22.firebaseapp.com",projectId:"omar-28e22",storageBucket:"omar-28e22.firebasestorage.app",messagingSenderId:"496194365995",appId:"1:496194365995:web:f4844a98b7e60710ccd86e",measurementId:"G-5L2R7Y2RQS"};
firebase.initializeApp(firebaseConfig);var FB=firebase.database();
function $(id){return document.getElementById(id)}

var ORDERS=[],currentDriver=null,currentTab='active';

// ===== Login =====
function doLogin(){
  var u=$('loginUser').value.trim(),p=$('loginPass').value;
  if(!u||!p){showToast('أدخل البيانات');return}
  FB.ref('fm/drivers').orderByChild('user').equalTo(u).once('value').then(function(s){
    var found=null;
    s.forEach(function(c){var d=c.val();if(d.pass===p){found={id:c.key,data:d}}});
    if(!found){$('loginError').style.display='block';setTimeout(function(){$('loginError').style.display='none'},3000);return}
    currentDriver=found;
    $('loginScreen').style.display='none';
    $('driverApp').style.display='block';
    $('displayName').textContent=u;
    $('driverName').textContent=found.data.name;
    loadOrders();
    showToast('مرحباً '+found.data.name);
  });
}

function doLogout(){
  currentDriver=null;
  $('driverApp').style.display='none';
  $('loginScreen').style.display='flex';
  $('loginUser').value='';$('loginPass').value='';
}

// ===== Tabs =====
function switchTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active')});
  document.querySelectorAll('.tab-content').forEach(function(c){c.style.display='none'});
  btn.classList.add('active');
  $('tab-'+tab).style.display='block';
}

// ===== Load Orders =====
function loadOrders(){
  if(!currentDriver)return;
  FB.ref('fm/orders').orderByChild('driver').equalTo(currentDriver.data.user).on('value',function(s){
    ORDERS=[];
    s.forEach(function(c){var o=c.val();o.id=c.key;ORDERS.push(o)});
    renderOrders();
    updateStats();
  });
}

// ===== Stats =====
function updateStats(){
  var myOrders=ORDERS.filter(function(o){return o.driver===currentDriver.data.user});
  $('statAssigned').textContent=myOrders.filter(function(o){return o.status==='assigned'}).length;
  $('statWaiting').textContent=myOrders.filter(function(o){return o.status==='waiting'}).length;
  $('statPostponed').textContent=myOrders.filter(function(o){return o.status==='postponed'}).length;
  $('statDelivered').textContent=myOrders.filter(function(o){return o.status==='delivered'}).length;
}

// ===== Status Text =====
function getStatusText(s){
  var t={assigned:'مسند',waiting:'قيد الانتظار',postponed:'مؤجل',suspended:'معلق',delivered:'مسلّم'};
  return t[s]||s;
}

// ===== Render =====
function renderOrders(){
  var myOrders=ORDERS.filter(function(o){return o.driver===currentDriver.data.user});
  
  if(currentTab==='active'){
    var active=myOrders.filter(function(o){return ['assigned','waiting','postponed','suspended'].indexOf(o.status)>=0});
    active.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
    
    $('activeOrders').innerHTML=active.length?active.map(function(o){
      return renderOrderCard(o);
    }).join(''):'<div style="color:var(--mut);text-align:center;padding:40px">لا توجد طلبات نشطة</div>';
  }else{
    var history=myOrders.filter(function(o){return o.status==='delivered'});
    history.sort(function(a,b){return (b.deliveredAt||b.ts||0)-(a.deliveredAt||a.ts||0)});
    
    $('historyOrders').innerHTML=history.length?history.map(function(o){
      return renderOrderCard(o,true);
    }).join(''):'<div style="color:var(--mut);text-align:center;padding:40px">لا يوجد سجل</div>';
  }
}

function renderOrderCard(o,isHistory){
  var stClass=o.status||'assigned';
  var actions='';
  
  if(!isHistory){
    if(o.status==='assigned'){
      actions='<button class="btnPickup" onclick="openAction(\''+o.id+'\',\'waiting\')">استلام الطلب</button>'+
              '<button class="btnPostpone" onclick="openAction(\''+o.id+'\',\'postponed\')">تأجيل</button>'+
              '<button class="btnSuspend" onclick="openAction(\''+o.id+'\',\'suspended\')">تعليق</button>';
    }else if(o.status==='waiting'){
      actions='<button class="btnDeliver" onclick="openAction(\''+o.id+'\',\'delivered\')">تم التسليم</button>'+
              '<button class="btnPostpone" onclick="openAction(\''+o.id+'\',\'postponed\')">تأجيل</button>'+
              '<button class="btnSuspend" onclick="openAction(\''+o.id+'\',\'suspended\')">تعليق</button>';
    }else if(o.status==='postponed'){
      actions='<button class="btnPickup" onclick="openAction(\''+o.id+'\',\'waiting\')">استئناف</button>'+
              '<button class="btnSuspend" onclick="openAction(\''+o.id+'\',\'suspended\')">تعليق</button>';
    }else if(o.status==='suspended'){
      actions='<button class="btnPickup" onclick="openAction(\''+o.id+'\',\'waiting\')">إعادة تفعيل</button>'+
              '<button class="btnPostpone" onclick="openAction(\''+o.id+'\',\'postponed\')">تأجيل</button>';
    }
    actions+='<button class="btnCall" onclick="callCustomer(\''+o.phone+'\')">اتصال</button>';
  }
  
  return '<div class="orderCard">'+
    '<div class="orderTop"><div class="orderCode">'+(o.code||'—')+'</div><div class="orderStatus status-'+stClass+'">'+getStatusText(o.status)+'</div></div>'+
    '<div class="orderInfo">'+
    '<div class="infoRow">الهاتف: <strong>'+o.phone+'</strong></div>'+
    '<div class="infoRow">المنطقة: <strong>'+o.area+'</strong></div>'+
    '<div class="infoRow">العنوان: <strong>'+o.addr+'</strong></div>'+
    '<div class="infoRow">المبلغ: <strong>'+fmt(o.amount,o.cur)+'</strong></div>'+
    (o.fee?'<div class="infoRow">أجرك: <strong style="color:var(--gold2)">'+fmt(o.fee,o.feeCur||o.cur)+'</strong></div>':'')+
    (o.note?'<div class="infoRow" style="grid-column:1/-1">ملاحظات: '+o.note+'</div>':'')+
    (o.driverNote?'<div class="infoRow" style="grid-column:1/-1;background:rgba(201,162,75,.1);padding:8px;border-radius:6px">ملاحظتك: '+o.driverNote+'</div>':'')+
    '</div>'+
    '<div class="orderActions">'+actions+'</div></div>';
}

// ===== Actions =====
function openAction(id,action){
  $('noteOrderId').value=id;
  $('noteAction').value=action;
  $('noteText').value='';
  $('collectedAmount').value='';
  
  var titles={
    waiting:'استلام الطلب',
    postponed:'تأجيل الطلب',
    suspended:'تعليق الطلب',
    delivered:'تأكيد التسليم'
  };
  var labels={
    waiting:'أضف ملاحظة (اختياري)',
    postponed:'سبب التأجيل',
    suspended:'سبب التعليق',
    delivered:'المبلغ المستلم من الزبون'
  };
  
  $('noteTitle').textContent=titles[action]||'إجراء';
  $('noteLabel').textContent=labels[action]||'ملاحظة';
  $('collectedGroup').style.display=action==='delivered'?'block':'none';
  
  $('noteModal').classList.add('active');
}

function confirmAction(){
  var id=$('noteOrderId').value;
  var action=$('noteAction').value;
  var note=$('noteText').value.trim();
  
  var data={
    status:action,
    updatedAt:Date.now(),
    driverNote:note
  };
  
  if(action==='delivered'){
    data.collected=parseFloat($('collectedAmount').value)||0;
    data.deliveredAt=Date.now();
  }
  if(action==='postponed'){
    data.postponeReason=note;
  }
  if(action==='suspended'){
    data.suspendReason=note;
  }
  
  FB.ref('fm/orders/'+id).update(data).then(function(){
    var msgs={
      waiting:'تم استلام الطلب',
      postponed:'تم تأجيل الطلب',
      suspended:'تم تعليق الطلب',
      delivered:'تم تسليم الطلب'
    };
    showToast('✅ '+(msgs[action]||'تم التحديث'));
    closeModal();
  }).catch(function(err){
    showToast('❌ خطأ: '+err.message);
  });
}

function callCustomer(phone){
  if(!phone){showToast('لا يوجد رقم هاتف');return}
  window.location.href='tel:'+phone;
}

// ===== Helpers =====
function fmt(v,c){return c==='syp'?Number(v||0).toLocaleString('en-US')+' ل.س':'$'+Number(v||0).toLocaleString('en-US')}

function closeModal(){$('noteModal').classList.remove('active')}

function showToast(m){
  var t=$('toast');t.textContent=m;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2800);
}

// Enter key
document.addEventListener('keypress',function(e){
  if(e.key==='Enter'&&$('loginScreen').style.display!=='none'){
    doLogin();
  }
});
</script></body></html>
